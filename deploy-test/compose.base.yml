# =============================================================================
# compose.base.yml — Deployment Test Framework (DTF) base topology
# =============================================================================
# The ONLY file that declares `backend` + `postgres`. It is opinion-free: no
# storage / proxy / sso / scanner choice lives here. Those come from additive
# overlay files under profiles/, stacked with `-f` by harness/run.sh.
#
# Env block is lifted verbatim from the working proof rig
# (target-backend/proof/compose.s3base.yml) so the backend boots identically,
# with two deliberate DTF changes from today's k8s gate:
#   * RATE_LIMIT_ENABLED defaults ON  (the gate overlay defaults it off; that is
#     why the rate-limit DoS classes go untested). Tiers that must disable it
#     set it explicitly per-invocation, exactly as the blue-fix pool documents.
#   * every host port is interpolated (${HTTP_PORT}/${PG_PORT}/${GRPC_PORT}) so
#     DTF inherits the pool's non-collision guarantee — never hardcoded.
#
# Required vars (run.sh exports them from the claimed slot):
#   DTF_SLOT, HTTP_PORT, PG_PORT, GRPC_PORT, BACKEND_IMAGE
# =============================================================================
name: ak-dtf${DTF_SLOT:?set DTF_SLOT}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ak-dtf${DTF_SLOT}-db
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: artifact_registry
    ports:
      - "127.0.0.1:${PG_PORT:?set PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d artifact_registry"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dtf]

  backend:
    # Release identity: this image sha is exactly what Workstream A pins.
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE (e.g. --backend-image ak-backend:fix-2574)}
    container_name: ak-dtf${DTF_SLOT}-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://registry:registry@postgres:5432/artifact_registry
      STORAGE_PATH: /data/storage
      BACKUP_PATH: /data/backups
      PLUGINS_DIR: /data/plugins
      JWT_SECRET: ${JWT_SECRET:-dtf-nonprod-cobalt-harbor-lantern-7f3a9c2e5b81}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TestRunner!2026secure}
      RUST_LOG: ${RUST_LOG:-info}
      HOST: 0.0.0.0
      PORT: "8080"
      # Overlays flip this (storage.*.yml). Base default = filesystem.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      # Physical object-key layout on cloud backends (backend
      # storage/keys.rs). Empty = the shipped default (repo-scoped,
      # `maven/{repo_id}/{path}` — #2624); "flat"/"legacy" selects the
      # superseded shared `maven/{path}` namespace. Passed through so a tier
      # can exercise the legacy layout on purpose (the isolation oracle's
      # flat-only door-refuse assertions branch on the same variable);
      # unset/empty behaves exactly as before.
      STORAGE_KEY_SCHEME: ${STORAGE_KEY_SCHEME:-}
      # DEFAULT ON — deliberate change from today's gate overlay.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # DEFAULT OFF (production posture: the SSRF guard rejects private/internal
      # upstream IPs). A tier whose oracle stands up a MOCK upstream on the DTF
      # docker network must opt in via its manifest, because that mock is only
      # reachable at a private address.
      UPSTREAM_ALLOW_PRIVATE_IPS: ${UPSTREAM_ALLOW_PRIVATE_IPS:-false}
    ports:
      - "127.0.0.1:${HTTP_PORT:?set HTTP_PORT}:8080"
      - "127.0.0.1:${GRPC_PORT:?set GRPC_PORT}:9090"
    volumes:
      - dtf_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      start_period: 40s
      retries: 24
    networks: [dtf]

networks:
  dtf:
    name: ak-dtf${DTF_SLOT}-net

volumes:
  dtf_data:
    name: ak-dtf${DTF_SLOT}_data

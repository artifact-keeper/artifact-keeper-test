# Tier-local compose override for ldap-env-bootstrap-lifecycle (artifact-keeper#4857).
# Layered on compose.base.yml + profiles/storage.filesystem.yml for the boots
# WITH an env-managed LDAP provider. No LDAP server is needed: the bootstrap
# only inserts/reconciles the ldap_configs row, nothing binds. The .invalid
# host never resolves. No bind DN / password: the provider is never used to
# log in. json-file logging so the oracle can read the bootstrap's WARN line
# (rootless podman's journald driver drops lines).
services:
  backend:
    environment:
      LDAP_NAME: dtf-env-ldap
      LDAP_URL: ldap://ldap.dtf.invalid:389
      LDAP_BASE_DN: ou=people,dc=dtf,dc=invalid
    logging:
      driver: json-file

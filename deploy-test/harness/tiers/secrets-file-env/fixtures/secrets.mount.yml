# Tier-local compose override for secrets-file-env (artifact-keeper#4142 / #4775).
# Every override in this directory is self-contained and is layered ALONE,
# directly on compose.base.yml (-f compose.base.yml -f <this>): it mounts the oracle's
# per-run secrets directory read-only at /run/secrets/ak, points the *_FILE
# companions at the paths the oracle exports per leg (SF_*; an empty value is
# "unset" by the backend's own rule), pins the json-file log driver (the oracle
# reads the startup error with docker logs; rootless podman's journald driver
# drops lines) and disables SELinux labelling for the bind mount.
# Self-contained and second in the -f list because docker compose 5.5 honours a
# per-key `environment: KEY: !reset` only in the file layered directly on the
# one that defines KEY; one file further down the reset is silently dropped
# (verified with `docker compose config`). profiles/storage.filesystem.yml only
# restates the base default STORAGE_BACKEND=filesystem, so it is left out.
#
# This one leaves the direct values from compose.base.yml in place.
services:
  backend:
    environment:
      DATABASE_URL_FILE: ${SF_DATABASE_URL_FILE:-}
      JWT_SECRET_FILE: ${SF_JWT_SECRET_FILE:-}
      ADMIN_PASSWORD_FILE: ${SF_ADMIN_PASSWORD_FILE:-}
    volumes:
      - "${SF_SECRETS_DIR:?set SF_SECRETS_DIR}:/run/secrets/ak:ro"
    security_opt:
      - label=disable
    logging:
      driver: json-file

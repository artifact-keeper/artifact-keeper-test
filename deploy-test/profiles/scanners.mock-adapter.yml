# =============================================================================
# profiles/scanners.mock-adapter.yml - a stand-in scanner adapter that only
#                                      answers its health probes
# =============================================================================
# Points TRIVY_ADAPTER_URL at `mock-adapter`, a stock python image running
# harness/tiers/health-monitor-dependencies/fixtures/mock_adapter.py. It
# answers GET /probe/healthy and /probe/ready with 200 and never scans, so a
# tier can exercise what the backend does when the adapter is up or gone (the
# oracle stops the container) without downloading the Trivy DB. No host port:
# the oracle reaches it with `docker exec`.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR.
# =============================================================================
services:
  mock-adapter:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-adapter
    command: ["python3", "/app/mock_adapter.py"]
    environment:
      MOCK_PORT: "80"
    volumes:
      - "${DTF_DIR}/harness/tiers/health-monitor-dependencies/fixtures/mock_adapter.py:/app/mock_adapter.py:ro"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this (python exits 2: can't open file).
    security_opt:
      - label=disable
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [dtf]

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-adapter:
        condition: service_healthy
    environment:
      TRIVY_ADAPTER_URL: http://mock-adapter:80
      EXPOSE_DETAILED_HEALTH: "true"

# =============================================================================
# profiles/storage.azurite.yml -- storage dimension = azure (Azurite)
# =============================================================================
# The Azure analog of storage.s3.yml (MinIO) and storage.gcs-emulator.yml.
# Adds the official Azurite emulator (blob service only) and makes Azure Blob
# the backend's DEFAULT storage backend.
#
#   * ADDS  `azurite-tls`: a python:3.12-slim one-shot that writes a throwaway
#     CA and a leaf certificate for `azurite` / 127.0.0.1 into the per-slot
#     volume ak-dtf<N>_azurite_tls. TLS is not optional: the backend reads
#     blobs through SAS URLs it signs with `spr=https` (health probe, copies),
#     and Azurite refuses an https-only SAS on a plain-HTTP request (403).
#   * ADDS  `azurite` (mcr.microsoft.com/azure-storage/azurite, blob only,
#     in-memory) serving https with that leaf, on a dedicated
#     172.26.<slot>.0/24 subnet. The backend's storage HTTP clients resolve
#     through the SSRF guard, so the emulator's private address is
#     allowlisted with AK_SSRF_ALLOW_PRIVATE_CIDRS=172.16.0.0/12 (the
#     gcs-emulator pattern). The blob port is published on
#     127.0.0.1:${S3_PORT} (this profile runs no MinIO) so an oracle can list
#     blobs from the host.
#   * ADDS  `azurite-mkcontainer`: creates the `ak-artifacts` container with a
#     Shared Key signed request (the backend never creates its container);
#     harness/tiers/azure-default-backend/fixtures/azurite_blob.py.
#   * Azurite runs with a custom account (AZURITE_ACCOUNTS) instead of the
#     built-in one, whose well-known key secret scanners flag: the key here
#     is deliberately low-entropy (base64 of 32 'A' bytes).
#   * PATCHES backend: STORAGE_BACKEND=azure, that account and key, the
#     path-style endpoint https://azurite:10000/dtfaccount, and
#     CUSTOM_CA_CERT_PATH pointing at the throwaway CA; pins the json-file
#     log driver so `docker logs` works for an oracle.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR, S3_PORT.
# =============================================================================
services:
  azurite-tls:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-azurite-tls
    entrypoint:
      - "/bin/sh"
      - "-c"
      - 'set -e; cd /tls; [ -s leaf.pem ] && exit 0; openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=dtf-azurite-ca" -keyout ca.key -out ca.pem 2>/dev/null; openssl req -newkey rsa:2048 -nodes -subj "/CN=azurite" -keyout leaf.key -out leaf.csr 2>/dev/null; printf "subjectAltName=DNS:azurite,DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n" > leaf.ext; openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -extfile leaf.ext -out leaf.pem 2>/dev/null; chmod 644 /tls/*; echo tls-ready'
    volumes:
      - azurite_tls:/tls
    networks:
      azemu: {}

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: ak-dtf${DTF_SLOT}-azurite
    depends_on:
      azurite-tls:
        condition: service_completed_successfully
    # Put Blob From URL (the backend's server-side copy) makes Azurite fetch
    # the SAS source URL from itself, over https: it must trust the CA too.
    environment:
      NODE_EXTRA_CA_CERTS: /tls/ca.pem
      # base64 of 32 'A' bytes, deliberately low-entropy: a test-only account.
      AZURITE_ACCOUNTS: "dtfaccount:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--cert", "/tls/leaf.pem", "--key", "/tls/leaf.key", "--skipApiVersionCheck", "--loose", "--inMemoryPersistence"]
    volumes:
      - azurite_tls:/tls:ro
    ports:
      - "127.0.0.1:${S3_PORT:?set S3_PORT}:10000"
    networks:
      azemu:
        ipv4_address: 172.26.${DTF_SLOT}.70

  azurite-mkcontainer:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-azurite-mk
    depends_on:
      - azurite
    command: ["python3", "/app/azurite_blob.py", "mkcontainer"]
    environment:
      AZURITE_URL: https://azurite:10000/dtfaccount
      AZURITE_CONTAINER: ak-artifacts
      AZURITE_CAFILE: /tls/ca.pem
    volumes:
      - "${DTF_DIR}/harness/tiers/azure-default-backend/fixtures/azurite_blob.py:/app/azurite_blob.py:ro"
      - azurite_tls:/tls:ro
    security_opt:
      - label=disable
    networks:
      azemu: {}

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      azurite-mkcontainer:
        condition: service_completed_successfully
    environment:
      STORAGE_BACKEND: azure
      AZURE_STORAGE_ACCOUNT: dtfaccount
      AZURE_STORAGE_CONTAINER: ak-artifacts
      # base64 of 32 'A' bytes, deliberately low-entropy, see AZURITE_ACCOUNTS.
      AZURE_STORAGE_ACCESS_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      AZURE_STORAGE_ENDPOINT: https://azurite:10000/dtfaccount
      CUSTOM_CA_CERT_PATH: /tls/ca.pem
      AK_SSRF_ALLOW_PRIVATE_CIDRS: 172.16.0.0/12
    volumes:
      - azurite_tls:/tls:ro
    # json-file so `docker logs` of the backend works under rootless podman
    # (an oracle reads the #3920 race log line).
    logging:
      driver: json-file
    networks:
      dtf: {}
      azemu: {}

networks:
  azemu:
    name: ak-dtf${DTF_SLOT}-azemu
    ipam:
      config:
        - subnet: 172.26.${DTF_SLOT}.0/24

volumes:
  azurite_tls:
    name: ak-dtf${DTF_SLOT}_azurite_tls

# =============================================================================
# profiles/secrets.webhook-key.yml — a webhook secret-encryption key for the
# backend
# =============================================================================
# Webhook signing secrets are stored encrypted with the AES key in
# AK_WEBHOOK_SECRET_KEY (backend services/webhook_secret_crypto.rs). The base
# topology sets no key, so `POST /api/v1/webhooks/{id}/rotate-secret` answers
# 500 ("webhook secret encryption is not configured") and a tier can never
# observe a rotation. This overlay PATCHES backend.environment with the key
# the tier's manifest derives at run time (DTF_WEBHOOK_SECRET_KEY: the base64
# of a fixed, non-production 32-byte ASCII string). The literal is computed,
# not committed, so no key-shaped token sits in the repository for a secret
# scanner to flag. It adds no service and no port.
#
# Used by the audit-event-coverage tier (artifact-keeper#4710), which asserts
# that a webhook secret rotation writes a WEBHOOK_SECRET_ROTATED audit row.
# Every backend version the DTF runs knows this variable, so the overlay is
# safe to stack on a pre-fix image.
# =============================================================================
services:
  backend:
    environment:
      AK_WEBHOOK_SECRET_KEY: ${DTF_WEBHOOK_SECRET_KEY:?set by the tier manifest (base64 of a 32-byte non-production string)}

# =============================================================================
# profiles/upstreams.mock-artifactory-items.yml - a migration SOURCE with
# per-item Artifactory properties and scripted per-item failures
# =============================================================================
# Sibling of upstreams.mock-artifactory-catalog.yml (same service, network and
# backend patches, for the same reasons). This one mounts the
# migration-items-filters tier's own mock, which additionally serves
# `GET /api/storage/{repo}/{path}?properties` from a control document the
# oracle writes, advertises a wrong digest for chosen items (so they FAIL) and
# lists chosen items it never serves (so a Debian index path is SKIPPED).
# See harness/tiers/migration-items-filters/fixtures/mock_artifactory.py.
#
#   * `mock-artifactory` on a per-slot 172.16.<slot>.0/24 subnet, allowlisted
#     by AK_SSRF_ALLOW_PRIVATE_CIDRS=172.16.0.0/12 (read
#     upstreams.mock-artifactory.yml's SUBNET CHOICE note);
#   * ALLOW_HTTP_INTEGRATIONS=1, because the mock speaks plain http:// and the
#     Artifactory client is otherwise built `https_only`.
# The upstreams.mock-artifactory* overlays declare the same service and
# network names, so they are alternatives: a tier stacks exactly one.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR.
# =============================================================================
services:
  mock-artifactory:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-artifactory
    command: ["python3", "/app/mock_artifactory.py"]
    # SELinux-enforcing hosts: see upstreams.mock-artifactory-catalog.yml.
    security_opt:
      - label=disable
    environment:
      MOCK_PORT: "80"
      MOCK_REPOS: "dtfmi-debian:debian,dtfmi-gen:generic"
      MOCK_CATALOG_DIR: "/srv/catalog"
    volumes:
      - "${DTF_DIR}/harness/tiers/migration-items-filters/fixtures/mock_artifactory.py:/app/mock_artifactory.py:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      mockartifactory:
        ipv4_address: 172.16.${DTF_SLOT}.60

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-artifactory:
        condition: service_healthy
    environment:
      AK_SSRF_ALLOW_PRIVATE_CIDRS: 172.16.0.0/12
      ALLOW_HTTP_INTEGRATIONS: "1"
    networks:
      dtf: {}
      mockartifactory: {}

networks:
  mockartifactory:
    name: ak-dtf${DTF_SLOT}-mockartifactory
    ipam:
      config:
        - subnet: 172.16.${DTF_SLOT}.0/24

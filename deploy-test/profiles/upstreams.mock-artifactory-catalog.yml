# =============================================================================
# profiles/upstreams.mock-artifactory-catalog.yml — a migration SOURCE that
# serves REAL Maven and Debian files
# =============================================================================
# Sibling of upstreams.mock-artifactory.yml (which serves a synthetic `generic`
# catalogue for the migration-progress-monotonic tier). This one mounts the
# migration-package-catalog tier's own copy of the mock, which reports each
# repository's Artifactory `packageType` (maven / debian) and serves files from
# /srv/catalog. The oracle builds those files on the host and `docker cp`s them
# in after the stack is up, so the container starts with empty repositories.
# See harness/tiers/migration-package-catalog/fixtures/mock_artifactory.py.
#
# Network and backend patches are the same as upstreams.mock-artifactory.yml,
# and for the same reasons:
#   * `mock-artifactory` on a per-slot 172.16.<slot>.0/24 subnet, allowlisted
#     by AK_SSRF_ALLOW_PRIVATE_CIDRS=172.16.0.0/12 (read that file's SUBNET
#     CHOICE note for why it is not 172.28);
#   * ALLOW_HTTP_INTEGRATIONS=1, because the mock speaks plain http:// and the
#     Artifactory client is otherwise built `https_only`.
# The two overlays declare the same service and network names, so they are
# alternatives: a tier stacks one or the other, never both.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR.
# =============================================================================
services:
  mock-artifactory:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-artifactory
    command: ["python3", "/app/mock_artifactory.py"]
    # On an SELinux-enforcing host (Fedora/RHEL + rootless podman) a bind
    # mount of a file labelled user_home_t is unreadable inside the container
    # ("python3: can't open file ... Permission denied", exit 2), so the mock
    # never becomes healthy. Disabling label separation for this one test
    # container avoids that without relabelling (`:z`) the checkout on disk;
    # on hosts without SELinux the option is a no-op.
    security_opt:
      - label=disable
    environment:
      MOCK_PORT: "80"
      MOCK_REPOS: "dtfcat-mvn:maven,dtfcat-deb:debian"
      MOCK_CATALOG_DIR: "/srv/catalog"
    volumes:
      - "${DTF_DIR}/harness/tiers/migration-package-catalog/fixtures/mock_artifactory.py:/app/mock_artifactory.py:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      mockartifactory:
        ipv4_address: 172.16.${DTF_SLOT}.60

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-artifactory:
        condition: service_healthy
    environment:
      AK_SSRF_ALLOW_PRIVATE_CIDRS: 172.16.0.0/12
      ALLOW_HTTP_INTEGRATIONS: "1"
    networks:
      dtf: {}
      mockartifactory: {}

networks:
  mockartifactory:
    name: ak-dtf${DTF_SLOT}-mockartifactory
    ipam:
      config:
        - subnet: 172.16.${DTF_SLOT}.0/24

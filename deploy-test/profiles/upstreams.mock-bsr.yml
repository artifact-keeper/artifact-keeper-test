# =============================================================================
# profiles/upstreams.mock-bsr.yml - a steerable BSR Connect upstream
# =============================================================================
# Adds `mock-bsr`, a stdlib-only Python HTTP server that answers Buf Schema
# Registry Connect unary calls (POST <prefix>/<Service>/<Method>) with canned
# JSON, counts calls per path, records the request headers it received, and
# can be told per path to answer 500 / 404 with a secret-looking body, send a
# body over AK's 16 MiB cap, stall past AK's 60 s timeout, or reset the
# connection. It exists so the protobuf-bsr-proxy tier (artifact-keeper#4284)
# can drive AK's BSR reverse proxy end to end. See
# harness/tiers/protobuf-bsr-proxy/fixtures/mock_bsr.py.
#
# The overlay:
#   * ADDS  `mock-bsr` on a per-slot 172.16.<slot>.0/24 subnet (the
#     upstreams.mock-static.yml layout), so AK's create-time SSRF check
#     allowlists it via AK_SSRF_ALLOW_PRIVATE_CIDRS=172.16.0.0/12. The tier
#     manifest also sets UPSTREAM_ALLOW_PRIVATE_IPS=true for the fetch.
#   * PUBLISHES the mock's control endpoints on 127.0.0.1:${TRIVY_PORT}
#     (8250+N, the spare per-slot port).
#   * PATCHES backend onto that network, sets AK_SSRF_ALLOW_PRIVATE_CIDRS,
#     raises the proxy module's log level to debug (the non-2xx upstream line
#     is a debug event) and pins the json-file log driver (the tier greps the
#     backend log).
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR, TRIVY_PORT.
# =============================================================================
services:
  mock-bsr:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-bsr
    command: ["python3", "/app/mock_bsr.py"]
    environment:
      MOCK_PORT: "80"
      MOCK_STALL_SECS: "75"
    volumes:
      - "${DTF_DIR}/harness/tiers/protobuf-bsr-proxy/fixtures/mock_bsr.py:/app/mock_bsr.py:ro"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this.
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:${TRIVY_PORT:?set TRIVY_PORT}:80"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      mockbsr:
        ipv4_address: 172.16.${DTF_SLOT}.71

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-bsr:
        condition: service_healthy
    environment:
      AK_SSRF_ALLOW_PRIVATE_CIDRS: 172.16.0.0/12
      RUST_LOG: info,artifact_keeper_backend::api::handlers::protobuf_bsr=debug
    logging:
      driver: json-file
    networks:
      dtf: {}
      mockbsr: {}

networks:
  mockbsr:
    name: ak-dtf${DTF_SLOT}-mockbsr
    ipam:
      config:
        - subnet: 172.16.${DTF_SLOT}.0/24

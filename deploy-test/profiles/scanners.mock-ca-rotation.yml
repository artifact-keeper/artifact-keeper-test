services:
  mock-ca-scanner:
    image: python:3.12.13-slim-bookworm
    command: ["python3", "-I", "/app/mock_scanner.py"]
    volumes:
      - "${DTF_DIR}/harness/tiers/custom-ca-rotation/fixtures/mock_scanner.py:/app/mock_scanner.py:ro"
      - ca_rotation_trust:/trust
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:${TRIVY_PORT:?set TRIVY_PORT}:80"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/__readyz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [dtf]

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-ca-scanner:
        condition: service_healthy
    environment:
      TRIVY_URL: https://mock-ca-scanner
      CUSTOM_CA_CERT_PATH: /etc/dtf-custom-ca/ca-bundle.pem
    volumes:
      - ca_rotation_trust:/etc/dtf-custom-ca:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/livez"]

volumes:
  ca_rotation_trust: {}

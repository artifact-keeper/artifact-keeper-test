# =============================================================================
# profiles/upstreams.mock-oci-classify.yml - an OCI upstream serving manifests
# the backend's parser and a Go client read differently, for the
# oci-scan-proxy-unclassifiable tier (artifact-keeper#5097)
# =============================================================================
# Adds `mock-oci-classify` (harness/tiers/oci-scan-proxy-unclassifiable/fixtures/
# mock_oci_classify.py), a stdlib-only Python OCI registry with raw manifest
# bodies.
#
# The overlay:
#   * ADDS the mock at 172.16.<slot>.83 on a per-slot 172.16.<slot>.0/24 subnet;
#     AK_SSRF_ALLOW_PRIVATE_CIDRS admits only its /32 (the tier manifest also
#     sets UPSTREAM_ALLOW_PRIVATE_IPS=true for the fetch).
#   * PUBLISHES the mock's control endpoints (/__digests, /__log) on
#     127.0.0.1:${TRIVY_PORT} (8250+N, the spare per-slot port), so this profile
#     cannot be combined with another that publishes TRIVY_PORT.
#   * PATCHES backend onto that network.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR, TRIVY_PORT.
# =============================================================================
services:
  mock-oci-classify:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-oci-classify
    command: ["python3", "-I", "/app/mock_oci_classify.py"]
    environment:
      MOCK_PORT: "80"
    volumes:
      - "${DTF_DIR}/harness/tiers/oci-scan-proxy-unclassifiable/fixtures/mock_oci_classify.py:/app/mock_oci_classify.py:ro"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this (python exits 2: can't open file).
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:${TRIVY_PORT:?set TRIVY_PORT}:80"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      mockociclassify:
        ipv4_address: 172.16.${DTF_SLOT}.83

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-oci-classify:
        condition: service_healthy
    environment:
      AK_SSRF_ALLOW_PRIVATE_CIDRS: 172.16.${DTF_SLOT}.83/32
    networks:
      dtf: {}
      mockociclassify: {}

networks:
  mockociclassify:
    name: ak-dtf${DTF_SLOT}-mockociclassify
    ipam:
      config:
        - subnet: 172.16.${DTF_SLOT}.0/24

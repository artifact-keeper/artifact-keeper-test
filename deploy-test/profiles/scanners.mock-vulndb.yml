# =============================================================================
# profiles/scanners.mock-vulndb.yml - a stand-in scanner adapter whose Trivy
#                                     database is 30 days old and offline
# =============================================================================
# Points TRIVY_ADAPTER_URL at `mock-vulndb`, a stock python image running
# harness/tiers/scan-vuln-db-age/fixtures/mock_vulndb_adapter.py. It answers
# the adapter's probes and GET /api/v1/vulndb as an air-gapped adapter whose
# imported DB was built 30 days ago, and never scans, so no Trivy DB is
# downloaded (artifact-keeper#5177). The backend sends the DB route's token
# as TRIVY_ADAPTER_VULNDB_TOKEN and reports a DB older than
# SCAN_VULN_DB_MAX_AGE_HOURS (7 days here) as stale. No host port: the
# oracle reads the mock's hit count with `docker exec`.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR.
# =============================================================================
services:
  mock-vulndb:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-vulndb
    command: ["python3", "/app/mock_vulndb_adapter.py"]
    environment:
      MOCK_PORT: "80"
      MOCK_TOKEN: dtf-vulndb-token
      MOCK_DB_AGE_DAYS: "30"
    volumes:
      - "${DTF_DIR}/harness/tiers/scan-vuln-db-age/fixtures/mock_vulndb_adapter.py:/app/mock_vulndb_adapter.py:ro"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this (python exits 2: can't open file).
    security_opt:
      - label=disable
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [dtf]

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-vulndb:
        condition: service_healthy
    environment:
      TRIVY_ADAPTER_URL: http://mock-vulndb:80
      TRIVY_ADAPTER_VULNDB_TOKEN: dtf-vulndb-token
      SCAN_VULN_DB_MAX_AGE_HOURS: "168"
    logging:
      driver: json-file

# =============================================================================
# profiles/storage.azurite-proxy-cache.yml: the proxy cache on Azure (Azurite)
# =============================================================================
# Composes AFTER storage.azurite. Sets AZURE_PROXY_CACHE_ENABLED=true (1.12.0,
# #4320): with STORAGE_BACKEND=azure the proxy cache of remote repositories
# lives in the Azure container instead of under STORAGE_PATH. A release
# without #4320 ignores it and keeps the #3923 filesystem fallback.
# =============================================================================
services:
  backend:
    environment:
      AZURE_PROXY_CACHE_ENABLED: "true"

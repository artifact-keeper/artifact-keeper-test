# =============================================================================
# profiles/upstreams.mockpypi-agegate.yml: upstreams=mockpypi-agegate overlay
# (PyPI age gate, artifact-keeper#4907)
# =============================================================================
# Sibling of upstreams.mockpypi.yml. The canned upstream (`mock-pypi`) serves
# the project `cuda-toolkit` with Warehouse JSON publish times
# (/pypi/cuda-toolkit/json) and a simple index (HTML, or PEP 691 JSON on
# request) whose filenames spell versions differently from the release keys
# (`cuda_toolkit-13.0.3.0-...whl` under release `13.0.3`). See
# harness/tiers/pypi-age-gate-pep440-lookup/fixtures/mock_pypi_agegate.py.
#
# Same escape-hatch discipline as upstreams.mockpypi.yml: the mock sits on a
# per-slot 172.16/12 subnet and the backend gets UPSTREAM_ALLOW_PRIVATE_IPS +
# AK_SSRF_ALLOW_PRIVATE_CIDRS=172.16/12 so the create-time upstream-URL check,
# the metadata fetch and the download-time href check all reach the mock.
# Shares the 172.28.<slot>.0/24 subnet with the other mockpypi profiles, so it
# cannot be stacked with them in one tier.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR.
# =============================================================================
services:
  mock-pypi:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-pypi
    command: ["python3", "/app/mock_pypi_agegate.py"]
    environment:
      MOCK_PORT: "80"
      MOCK_HOST: "mock-pypi"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this (the process exits on open).
    security_opt:
      - label=disable
    volumes:
      - "${DTF_DIR}/harness/tiers/pypi-age-gate-pep440-lookup/fixtures/mock_pypi_agegate.py:/app/mock_pypi_agegate.py:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      mockpypi:
        ipv4_address: 172.28.${DTF_SLOT}.50

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      mock-pypi:
        condition: service_healthy
    environment:
      # Scoped to 172.16/12 only (the mock's subnet), mirroring proxy.squid.yml.
      UPSTREAM_ALLOW_PRIVATE_IPS: "true"
      AK_SSRF_ALLOW_PRIVATE_CIDRS: 172.16.0.0/12
    networks:
      dtf: {}
      mockpypi: {}

networks:
  # backend <-> mock-pypi. 172.16/12 subnet so the mock upstream is allowlisted
  # by AK_SSRF_ALLOW_PRIVATE_CIDRS at repo-create time.
  mockpypi:
    name: ak-dtf${DTF_SLOT}-mockpypi
    ipam:
      config:
        - subnet: 172.28.${DTF_SLOT}.0/24

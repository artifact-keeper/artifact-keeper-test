# =============================================================================
# profiles/proxy.route-timeout.yml - a 30 s route timeout in front of AK
# =============================================================================
# Adds `route-timeout-proxy`, a stdlib-python reverse proxy
# (harness/tiers/repo-delete-reclaims-storage-job/fixtures/route_timeout_proxy.py)
# that forwards every request to backend:8080 and answers 504 "upstream request
# timeout" when the backend has not started its response within ROUTE_TIMEOUT
# seconds (30 by default), the way an ingress or load balancer does
# (artifact-keeper#4311).
#
# Publishes the proxy on 127.0.0.1:${TRIVY_PORT} (8250+N, the spare per-slot
# port); the backend stays reachable directly on ${HTTP_PORT}.
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR, TRIVY_PORT.
# =============================================================================
services:
  route-timeout-proxy:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-route-timeout-proxy
    command: ["python3", "-u", "/app/route_timeout_proxy.py"]
    environment:
      PROXY_PORT: "8080"
      UPSTREAM: "backend:8080"
      ROUTE_TIMEOUT: "${ROUTE_TIMEOUT:-30}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - "${DTF_DIR}/harness/tiers/repo-delete-reclaims-storage-job/fixtures/route_timeout_proxy.py:/app/route_timeout_proxy.py:ro"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this.
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:${TRIVY_PORT:?set TRIVY_PORT}:8080"
    logging:
      driver: json-file
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/__ctl/readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [dtf]

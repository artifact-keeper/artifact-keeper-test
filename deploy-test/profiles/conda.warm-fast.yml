# =============================================================================
# profiles/conda.warm-fast.yml: conda warm tunables for the
# conda-warm-from-lockfile tier (artifact-keeper#4184)
# =============================================================================
# CONDA_WARM_UPSTREAM_RPS=100 (default 20) keeps a 1,000-package warm near
# 10 s while still binding below what the mock can serve, so the tier can
# assert the rate bound. CONDA_WARM_CONCURRENCY stays at its default of 8.
# CONDA_WARM_ITEM_LEASE_SECS=30 (default 600): after the tier restarts the
# backend mid-warm, the claims the killed process held lapse in 30 s and the
# resumed runner takes them over.
# =============================================================================
services:
  backend:
    environment:
      CONDA_WARM_UPSTREAM_RPS: "100"
      CONDA_WARM_CONCURRENCY: "8"
      CONDA_WARM_ITEM_LEASE_SECS: "30"

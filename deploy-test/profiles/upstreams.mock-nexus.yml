# =============================================================================
# profiles/upstreams.mock-nexus.yml: a scripted Nexus migration SOURCE
# =============================================================================
# Stacks on upstreams.mock-artifactory.yml: it joins that profile's
# `mockartifactory` network and relies on the backend settings it makes
# (AK_SSRF_ALLOW_PRIVATE_CIDRS=172.16.0.0/12 so the connection URL validates,
# ALLOW_HTTP_INTEGRATIONS because the mock speaks plain HTTP).
#
#   * mock-nexus  172.16.<slot>.61 on mockartifactory. A stdlib-Python server
#                 (harness/tiers/migration-progress-monotonic/fixtures/
#                 mock_nexus.py) answering the Nexus 3 REST endpoints
#                 `NexusClient` calls over a fixed catalogue, and counting
#                 every listing request per endpoint and repository at
#                 /__stats (artifact-keeper#6360, #6260).
#
# Required vars (run.sh exports them): DTF_SLOT, DTF_DIR.
# =============================================================================
services:
  mock-nexus:
    image: python:3.12-slim
    container_name: ak-dtf${DTF_SLOT}-mock-nexus
    command: ["python3", "/app/mock_nexus.py"]
    environment:
      MOCK_PORT: "80"
      # nx-wide: the cancel gate's 400 empty pages (about 48 s of listing at
      # the client's 100 ms throttle plus this delay). nx-wide-ok: the
      # control's 120, more than two 50-page budgets.
      WIDE_PAGES: "400"
      WIDE_OK_PAGES: "120"
      MOCK_LIST_DELAY_MS: "20"
    # The bind-mounted fixture is unreadable to the container on an
    # SELinux-enforcing host without this (the process exits on open).
    security_opt:
      - label=disable
    volumes:
      - "${DTF_DIR}/harness/tiers/migration-progress-monotonic/fixtures/mock_nexus.py:/app/mock_nexus.py:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/__readyz',timeout=2).read()==b'ok' else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      mockartifactory:
        ipv4_address: 172.16.${DTF_SLOT}.61

  backend:
    depends_on:
      mock-nexus:
        condition: service_healthy

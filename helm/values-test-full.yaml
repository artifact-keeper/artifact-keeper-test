# values-test-full.yaml - Full-stack test deployment overlay
#
# Extends values-test.yaml with security scanning services (Trivy, scan
# workspace). Used by create-test-namespace.sh --full-stack for test suites
# that exercise vulnerability scanning, SBOM generation, and proxy caching.
#
# Does NOT enable DependencyTrack (requires complex bootstrapping, handled
# separately).

# Use a stable name so service URLs are predictable regardless of release name
fullnameOverride: artifact-keeper

backend:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-backend
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  # Release-gate runs the full gate matrix (20+ test pods: lifecycle,
  # platform, format-containers, format-native, pinned-cve, security, ...)
  # concurrently against this ONE shared backend. Under that fan-out the
  # backend's peak RSS (Rust workers + upload buffers + OpenSearch/Meili
  # index round-trips + Trivy scan orchestration in the same critical path)
  # blew past the old 2Gi limit and the pod was OOMKilled. Because every
  # gate's auth_admin() re-checks readiness with only a 30s budget
  # (tests/lib/common.sh), a single OOM-restart window during the run
  # cascades into the whole matrix failing "backend not ready after 30s"
  # (release-gate run 28901902700 / 2026-07-07: all gates down; the runs
  # where the pod happened to survive instead surfaced real per-test bugs).
  #
  # NOTE: the "namespace quota" the older comments blame is a red herring:
  # create-test-namespace.sh never creates a ResourceQuota and the
  # TEST_NAMESPACE_*/TEST_MAX_* repo vars are not consumed anywhere, so the
  # only memory ceiling in effect is this pod limit. rocky (the ARC node)
  # has ~157Gi and sits at ~15% used, so we can size the backend generously.
  # Raised memory 2Gi -> 6Gi (request 256Mi -> 1Gi) and CPU limit 2 -> 3.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 6Gi
  env:
    ENVIRONMENT: test
    RUST_LOG: info
    ADMIN_PASSWORD: TestRunner!2026secure
    ACCOUNT_LOCKOUT_THRESHOLD: "0"
    # See values-test.yaml for rationale (iac#97). Parallel test pods exhaust
    # the default 120/min auth rate-limit on shared admin bootstrap.
    RATE_LIMIT_EXEMPT_USERNAMES: "admin"
    # Release-gate runs 20+ suites against ONE shared backend; per-user/IP and
    # global auth/API windows trip 429 across a full suite run (e.g. the totp
    # backup-code single-use test gets 429 instead of 401/consume). The gate tests
    # functional correctness, not rate-limiting (the rate-limit suite skips here),
    # so disable the limiter for the test deploy.
    RATE_LIMIT_ENABLED: "false"
    # SSRF private-IP allowlist for the test deploy.
    #
    # The gate runs INSIDE the cluster on ARC runner pods. Two suites need
    # the backend to reach a private (RFC1918) target:
    #   - webhook tests bind a mock receiver on the runner pod and POST the
    #     runner pod's RFC1918 IP (10.244.x) as the webhook target
    #     (artifact-keeper-test #199, PR #201);
    #   - repo-proxy / pull-through tests create remote repos whose upstream
    #     is the in-cluster backend Service DNS, which resolves to a ClusterIP
    #     (10.96.x) (artifact-keeper-test #122, backend #1224).
    #
    # We DELIBERATELY use the narrow, CIDR-scoped allowlist
    # (AK_SSRF_ALLOW_PRIVATE_CIDRS, backend #1224) rather than the blanket
    # UPSTREAM_ALLOW_PRIVATE_IPS / WEBHOOK_ALLOW_PRIVATE_IPS toggles. The CIDR
    # list applies to BOTH the upstream and webhook contexts and, when set,
    # OVERRIDES the blanket toggles (backend validation.rs private_ip_allowed).
    # It exempts ONLY this cluster's networks:
    #   - 10.96.0.0/12  -> Service ClusterIP range (backend svc upstreams)
    #   - 10.244.0.0/16 -> Pod CIDR (runner-pod webhook mock receiver)
    #
    # Security note (DO NOT widen): every IP the security SSRF suites probe
    # stays BLOCKED because it is outside both CIDRs (and metadata/loopback
    # are hard-blocked regardless of any allowlist):
    #   - cloud metadata 169.254.169.254 / 192.0.0.192 / 100.100.100.200 -- hard-blocked
    #   - loopback 127.0.0.1 / ::1 / link-local -- hard-blocked
    #   - RFC1918 probes 10.0.0.1 (< 10.96), 172.16.0.1, 192.168.1.1 -- outside both CIDRs
    # so tests/security/test-ssrf-prevention.sh (RFC1918 webhook cases, made
    # allowlist-aware) and tests/pullthrough/test-oci-remote-upstream-ssrf.sh
    # (RFC1918/metadata/loopback upstream rejection) still pass.
    #
    # Do NOT set UPSTREAM_ALLOW_PRIVATE_IPS=1 here: that blanket toggle would
    # allow ALL RFC1918 upstreams (incl. the security suite's 10.0.0.1 /
    # 192.168.1.1 probes), silently passing the upstream SSRF assertions.
    AK_SSRF_ALLOW_PRIVATE_CIDRS: "10.96.0.0/12,10.244.0.0/16"
    # Retained for documentation/back-compat. While AK_SSRF_ALLOW_PRIVATE_CIDRS
    # is set it is IGNORED (the CIDR list governs the webhook context too), but
    # the webhook mock's pod IP is inside 10.244.0.0/16 so webhook delivery
    # still works.
    WEBHOOK_ALLOW_PRIVATE_IPS: "1"
    # Enable the Webhooks v2 EventBus producer. It is OFF by default in the
    # backend (WEBHOOKS_V2_PRODUCER_ENABLED defaults to false) so a fresh
    # cluster does not double-deliver while System B notifications are still
    # in their deprecation window. Without it, no code path inserts into
    # webhook_deliveries from a real domain event, so the delivery-producer
    # suites (webhook-delivery, event-delivery-status-filter) hard-fail with
    # "no delivery row appeared within 30s; producer may not be running" even
    # though the webhook was created and the event fired. The suite comments
    # already assume "the harness sets it to 1"; this is where the harness
    # actually does so. (Release-gate run 26616763325: webhook-delivery 4
    # failures, all rooted at the producer never starting.)
    WEBHOOKS_V2_PRODUCER_ENABLED: "true"
    # Blob GC is opt-in (BLOB_GC_ENABLED defaults false → the admin
    # storage-gc endpoint dry-runs and never reclaims). Enable it so the
    # v1.3.0 OCI GC reclaim gate (test-oci-gc-mark-sweep.sh, #1660) can prove
    # an unreferenced blob is actually deleted. Keep the sweep grace short so
    # the reclaim is observable inside the gate's poll window.
    BLOB_GC_ENABLED: "true"
    BLOB_GC_SWEEP_GRACE_SECS: "5"
    # OCI blob GC runs only via the scheduler cron (GC_SCHEDULE, default
    # hourly); the gate's oci-gc test polls for ~30s, so mark+sweep must fire
    # every few seconds for the grace=5 reclaim to be observable. 6-field cron
    # (sec min hour dom mon dow) = every 10 seconds. See artifact-keeper-test#284.
    GC_SCHEDULE: "*/10 * * * * *"
    # Registry host the backend embeds in grype scan-target refs. The backend
    # composes the ref via resolve_registry_host, which prefers
    # AK_GRYPE_REGISTRY_HOST, then PEER_PUBLIC_ENDPOINT, then the dev fallback
    # http://localhost:8080 (backend grype_scanner.rs:334). Unset, the
    # scanner-adapter is handed localhost refs it can never resolve (its own
    # loopback), so image scans fail. fullnameOverride=artifact-keeper makes the
    # backend Service "artifact-keeper-backend"; SCANNER_TRIVY_INSECURE=true
    # already covers the plain-http pull. See artifact-keeper-test#308.
    AK_GRYPE_REGISTRY_HOST: "http://artifact-keeper-backend:8080"
    # NOTE: TRIVY_URL and SCAN_WORKSPACE_PATH were previously set here, but
    # the chart's backend-deployment.yaml auto-injects them when
    # trivy.enabled=true. Setting them here too produces duplicate env keys
    # and helm rejects the manifest. Kept the chart-side values authoritative.
    #
    # Object-storage emulators (helm/storage-emulators.yaml, deployed by
    # create-test-namespace.sh --full-stack before this install). With these
    # set, main.rs registers additional named "s3" and "azure" backends at
    # boot, which tests/platform/test-storage-backend-{s3,azure}.sh exercise.
    # The filesystem backend stays the default (STORAGE_BACKEND unset); repos
    # opt in per-repo via storage_backend. Credentials are throwaway
    # test-namespace values; the Azurite key is the PUBLIC well-known
    # emulator key from Azure SDK docs, not a secret.
    S3_BUCKET: "ak-e2e"
    S3_REGION: "us-east-1"
    S3_ENDPOINT: "http://storage-minio:9000"
    S3_ACCESS_KEY_ID: "ak-test-access"
    S3_SECRET_ACCESS_KEY: "ak-test-secret-2026"
    # AZURE deliberately absent: Shared Key signing is wrong for path-style
    # (Azurite) endpoints, so registration succeeds but every upload 403s
    # (artifact-keeper#2649). The Azurite deployment and init Job already
    # ride along in storage-emulators.yaml; when #2649 ships, uncomment and
    # test-storage-backend-azure.sh starts running with no other changes.
    # The Azurite key below is the PUBLIC well-known emulator key.
    # AZURE_STORAGE_ACCOUNT: "devstoreaccount1"
    # AZURE_STORAGE_CONTAINER: "ak-e2e"
    # AZURE_STORAGE_ACCESS_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
    # AZURE_STORAGE_ENDPOINT: "http://storage-azurite:10000/devstoreaccount1"
    # GCS deliberately absent: the backend has no endpoint override yet
    # (artifact-keeper#2646). test-storage-backend-gcs.sh skips until then.
  persistence:
    size: 2Gi
  scanWorkspace:
    enabled: true
    size: 2Gi

web:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-web
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  # CPU rebalanced for stress-tests: previous 500m backend vs 500m postgres
  # produced no headroom for postgres under sustained load. The sqlx pool
  # acquire histogram is not currently exported, so the connection between
  # CPU contention and the observed 33-54% sustained-load error rate is
  # inferential (worker timeouts but no client-side `000` codes, low
  # postgres CPU% in `kubectl top` at peak). This rebalance is a working
  # hypothesis; #154 tracks adding pg_stat_activity + acquire-time capture
  # to confirm or refute it post-merge.
  #
  # New layout: postgres at 250m request / 2000m limit, backend at 500m /
  # 2000m. Ratio is now ~1:1 at request and 1:1 at limit. The scheduler
  # can place the burst alongside backend + trivy + meilisearch.
  # Namespace request sum: 500m (backend) + 50m (web) + 250m (postgres) +
  # 100m (trivy) + 100m (meilisearch) = 1000m, well under the 4 CPU
  # quota. Limit sum is intentionally oversubscribed (5250m vs 4 CPU);
  # ResourceQuota is NOT enabled on this namespace so the
  # oversubscription is allowed by the scheduler. If a quota is added
  # later, postgres' limit must drop or backend's must come down too.
  # Refs: artifact-keeper-test#140, #154, artifact-keeper#1088, artifact-keeper#1176
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  persistence:
    size: 2Gi
  # The chart's secrets.yaml validation expects auth.password (not a flat
  # password key). Mirrors the structure used in values-test.yaml.
  auth:
    username: registry
    password: "test-db-password"
    database: artifact_registry

meilisearch:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 1Gi
  masterKey: "artifact-keeper-test-key"

trivy:
  enabled: true
  image:
    repository: aquasec/trivy
    tag: "0.62.1"
  # Vulnerability DB: pull from the org mirror ghcr.io/artifact-keeper/trivy-db
  # and pre-seed it with an init container so the DB is present before the
  # server accepts scans. Upstream ghcr.io/aquasecurity/trivy-db proved
  # unreliable from the gate cluster: anonymous pulls hit rate-limit denials
  # once two components (the Trivy server and the scanner-adapter) both pull,
  # and authenticating with GITHUB_TOKEN did not help because ghcr's token
  # exchange denies an artifact-keeper token for another org's package
  # (aquasecurity), which is what failed on attempts 4-6. The org mirror is
  # org-controlled and public; its refresh automation is tracked in
  # arc-runners#7. repository + preseed together is the chart's documented
  # "make the fetch reliable" combination. The Java DB (javaRepository) is left
  # empty so Trivy uses its built-in ghcr default. skipUpdate stays false.
  # See artifact-keeper-test#300.
  db:
    repository: ghcr.io/artifact-keeper/trivy-db
    preseed:
      enabled: true
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

# Container-image scans run in the scanner-adapter's in-process Trivy, which
# does NOT read the trivy.db.* server settings above (#281 fixed only the Trivy
# server, used for filesystem/SBOM scans). Point the adapter's own Trivy at the
# org mirror ghcr.io/artifact-keeper/trivy-db so image scans do not hit the
# rate-limited mirror.gcr.io or the unreliable upstream aquasecurity DB.
# Upstream ghcr.io/aquasecurity/trivy-db proved unreliable from the gate
# cluster: anonymous pulls hit rate-limit denials once both the Trivy server
# and this adapter pull, and GITHUB_TOKEN was denied by ghcr's token exchange
# for another org's package (attempts 4-6). The mirror is org-controlled and
# public; its refresh automation is tracked in arc-runners#7. The #293 workflow
# token injection (scannerAdapter.env.TRIVY_USERNAME/TRIVY_PASSWORD via helm
# --set) is left in place: it is harmless and valid for a same-org package.
#
# The chart's scanner-adapter-deployment.yaml renders these with
# `range $key, $value := .Values.scannerAdapter.env`, i.e. it iterates the
# whole map, and Helm deep-merges this override into the chart's default
# scannerAdapter.env per key. The chart default sets SCANNER_TRIVY_INSECURE:
# "true" (the adapter reaches the AK registry over the plain-HTTP in-cluster
# Service); it would survive the merge on its own, but we replicate it here so
# the override is self-describing. TRIVY_DB_REPOSITORY is the additive key.
# See artifact-keeper-test#300 (mirror switch) and #285 (original override).
scannerAdapter:
  env:
    TRIVY_DB_REPOSITORY: "ghcr.io/artifact-keeper/trivy-db"
    SCANNER_TRIVY_INSECURE: "true"

secrets:
  jwtSecret: "ak-ci-nonprod-q7z6wharZXoYYW3BI1ZPSdbMDyXrXS6DiCajP8IPCHg4Bjgb"

# Dependency-Track: enabled so security-tests can exercise the SBOM
# upload + findings sync path. The chart's bootstrap init container
# performs the admin force-password-change + team-key provisioning
# and writes the API key to /shared/dtrack-api-key on the backend
# pod's shared volume. The release-gate security-tests job extracts
# that key via `kubectl exec` and exports DEPENDENCY_TRACK_API_KEY
# (#200).
#
# Resource sizing matches helm/values-smoke-with-deps.yaml -- the
# UI/API pod is much lighter than DT's analyzer pool, and we only
# need API connectivity for the integration suite.
dependencyTrack:
  enabled: true
  # Admin password used by the bootstrap init container's force-
  # password-change + login flow. Non-empty is the only requirement.
  adminPassword: "TestDtrack!2026secure"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Disabled services: not needed for scanning test runs
edge:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

cosign:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

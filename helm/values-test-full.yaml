# values-test-full.yaml - Full-stack test deployment overlay
#
# Extends values-test.yaml with security scanning services (Trivy, scan
# workspace). Used by create-test-namespace.sh --full-stack for test suites
# that exercise vulnerability scanning, SBOM generation, and proxy caching.
#
# Does NOT enable DependencyTrack (requires complex bootstrapping, handled
# separately).

# Use a stable name so service URLs are predictable regardless of release name
fullnameOverride: artifact-keeper

backend:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-backend
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    ENVIRONMENT: test
    RUST_LOG: info
    ADMIN_PASSWORD: TestRunner!2026secure
    ACCOUNT_LOCKOUT_THRESHOLD: "0"
    # See values-test.yaml for rationale (iac#97). Parallel test pods exhaust
    # the default 120/min auth rate-limit on shared admin bootstrap.
    RATE_LIMIT_EXEMPT_USERNAMES: "admin"
    # NOTE: TRIVY_URL and SCAN_WORKSPACE_PATH were previously set here, but
    # the chart's backend-deployment.yaml auto-injects them when
    # trivy.enabled=true. Setting them here too produces duplicate env keys
    # and helm rejects the manifest. Kept the chart-side values authoritative.
  persistence:
    size: 2Gi
  scanWorkspace:
    enabled: true
    size: 2Gi

web:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-web
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  # CPU rebalanced for stress-tests: previous 2000m backend vs 500m postgres
  # produced a 4:1 ratio. Under sustained load the backend issued queries
  # faster than the database could serve them, the slowest sqlx pool
  # acquires hit the 30s acquire_timeout, and the timeouts surfaced as
  # HTTP 500s in the stress suites. Target is closer to 2:1, achieved by
  # raising the postgres limit to 2000m (and the request to 250m so the
  # scheduler can place the pod for the burst alongside backend + trivy +
  # meilisearch). Mirrors the rebalance applied in values-test.yaml.
  # Refs: artifact-keeper-test#140, artifact-keeper#1088, artifact-keeper#1176
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  persistence:
    size: 2Gi
  # The chart's secrets.yaml validation expects auth.password (not a flat
  # password key). Mirrors the structure used in values-test.yaml.
  auth:
    username: registry
    password: "test-db-password"
    database: artifact_registry

meilisearch:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 1Gi
  masterKey: "artifact-keeper-test-key"

trivy:
  enabled: true
  image:
    repository: aquasec/trivy
    tag: "0.62.1"
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

secrets:
  jwtSecret: "test-jwt-secret-not-for-production"

# Disabled services: not needed for scanning test runs
dependencyTrack:
  enabled: false

edge:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

cosign:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

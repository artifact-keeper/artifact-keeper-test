# values-test.yaml - Single-instance test deployment overlay
#
# Used by create-test-namespace.sh to deploy an isolated test environment.
# Image tags are overridden at deploy time via --set.

# Use a stable name so service URLs are predictable regardless of release name
fullnameOverride: artifact-keeper

backend:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-backend
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    ENVIRONMENT: test
    RUST_LOG: info
    ADMIN_PASSWORD: TestRunner!2026secure
    ACCOUNT_LOCKOUT_THRESHOLD: "0"
  persistence:
    size: 2Gi

web:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-web
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 2Gi
  auth:
    username: registry
    password: "test-db-password"
    database: artifact_registry

# Search backend: in v1.2.x the chart deploys OpenSearch (replaces Meilisearch).
# For most release-gate tests we don't actually exercise search end-to-end, so
# disable it to keep the test namespace lean. The dedicated `search-tests`
# suite that does need it can be expanded later to deploy with opensearch
# enabled and disableSecurityPlugin: true.
opensearch:
  enabled: false

secrets:
  jwtSecret: "test-jwt-secret-not-for-production"

# Disabled services: not needed for basic test runs
trivy:
  enabled: false

dependencyTrack:
  enabled: false

edge:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

cosign:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

scanWorkspace:
  enabled: false

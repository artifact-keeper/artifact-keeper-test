# values-test.yaml - Single-instance test deployment overlay
#
# Used by create-test-namespace.sh to deploy an isolated test environment.
# Image tags are overridden at deploy time via --set.

# Use a stable name so service URLs are predictable regardless of release name
fullnameOverride: artifact-keeper

backend:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-backend
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  # CPU bumped from 2 to 2500m for v1.2.x: uploads now write to OpenSearch
  # in the same critical path, so the backend competes with the JVM for
  # CPU under sustained load. Total namespace CPU requests stay under
  # the 4 CPU quota: 750m (backend) + 50m (web) + 50m (postgres) +
  # 100m (opensearch) = 950m requested, with limits totaling 4250m
  # (oversubscribed at the limit, fine for CI smoke).
  resources:
    requests:
      cpu: 750m
      memory: 384Mi
    limits:
      cpu: 2500m
      memory: 2Gi
  env:
    ENVIRONMENT: test
    RUST_LOG: info
    ADMIN_PASSWORD: TestRunner!2026secure
    ACCOUNT_LOCKOUT_THRESHOLD: "0"
    # Release-gate runs 20+ test pods in parallel. Each calls auth_admin to
    # bootstrap via POST /api/v1/auth/login with the shared admin user, which
    # exhausts the default 120/min auth rate-limit bucket and trips HTTP 429
    # (the failing-on-main pattern in iac#97). Exempt the admin user so the
    # bootstrap flow doesn't compete with itself across parallel pods. Per-test
    # users that the suites create are still rate-limited normally.
    RATE_LIMIT_EXEMPT_USERNAMES: "admin"
    # Allow private-IP webhook URLs. Webhook tests run a mock receiver on
    # 127.0.0.1:18772 in the test pod and register webhooks pointing at
    # that address. The backend's opt-in private-IP SSRF allowlist (from
    # artifact-keeper#1201) rejects 127.0.0.1 by default, which fails
    # tests/webhooks/test-webhook-* in release-gate. The relevant backend
    # env var is `UPSTREAM_ALLOW_PRIVATE_IPS` (read by
    # `validation::upstream_allow_private_ips_enabled`); the
    # `validate_webhook_url` helper routes through the same
    # `validate_outbound_url` gate. Enabling here scopes the relaxation
    # to the test deploy only; production deploys keep the default
    # deny-private behavior. (PR #187 originally used a placeholder
    # `WEBHOOK_ALLOW_PRIVATE_IPS` env name that the backend does not
    # read; rc.1 release-gate run 26116464151 confirmed the flag had no
    # effect because of the rename.)
    UPSTREAM_ALLOW_PRIVATE_IPS: "1"
    # Enable the Webhooks v2 EventBus producer (OFF by default in the backend).
    # Without it, no code path enqueues webhook_deliveries rows from a real
    # domain event, so the delivery-producer suites fail with "no delivery row
    # appeared; producer may not be running". The webhook suites' comments
    # assume "the harness sets it to 1"; this is the harness doing so.
    WEBHOOKS_V2_PRODUCER_ENABLED: "true"
    # NOTE: this non-full-stack overlay sets WEBHOOK_ALLOW_PRIVATE_IPS too so
    # webhook tests run here also allow the RFC1918 receiver. Backend #1435
    # split UPSTREAM_ vs WEBHOOK_; the webhook validator reads the WEBHOOK_
    # one. Without it, webhook create toward the runner pod's RFC1918 IP is
    # rejected (default-deny) and the webhook suites fail at create time.
    WEBHOOK_ALLOW_PRIVATE_IPS: "1"
  persistence:
    size: 2Gi

web:
  image:
    repository: ghcr.io/artifact-keeper/artifact-keeper-web
    tag: dev
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  # CPU rebalanced for stress-tests. The previous 2500m backend vs 500m
  # postgres layout (5:1) is hypothesised to have starved the database
  # under sustained load: workers timed out client-side and surfaced as
  # HTTP 500s, which matches the 33-54% error rate test-sustained-load
  # measured on :1.1-dev. The sqlx pool acquire histogram is not
  # currently exported by the backend, so the link between the ratio and
  # the error rate is inferential; the rebalance is a working hypothesis
  # whose effect should be visible in post-merge runs. #154 tracks adding
  # pg_stat_activity + sqlx acquire-time capture so the next operator
  # has direct evidence, not narrative, to work from.
  #
  # New layout: postgres at 250m request / 2000m limit. Total namespace
  # requests: 750m (backend) + 50m (web) + 250m (postgres) + 100m
  # (opensearch) = 1150m, well under the 4 CPU quota. Limit sum
  # (2500m + 250m + 2000m + 1000m = 5750m) intentionally oversubscribes
  # the quota; ResourceQuota is NOT enabled on this namespace so the
  # scheduler allows it. If a quota is added later the postgres limit
  # (or the backend's) must drop accordingly.
  # Refs: artifact-keeper-test#140, #154, artifact-keeper#1088, artifact-keeper#1176
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  persistence:
    size: 2Gi
  auth:
    username: registry
    password: "test-db-password"
    database: artifact_registry

# Search backend: in v1.2.x the chart deploys OpenSearch (replaces Meilisearch).
# Enable it so the search-tests suite can run end-to-end. disableSecurityPlugin
# keeps us off the cert/auth dance that production uses (the chart's default
# for non-prod). Reduced JVM heap and resources to fit the test namespace's
# 4 CPU / 8 Gi quota alongside backend, web, and postgres.
opensearch:
  enabled: true
  disableSecurityPlugin: true
  javaOpts: "-Xms256m -Xmx256m"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 1Gi

secrets:
  jwtSecret: "test-jwt-secret-not-for-production"

# Disabled services: not needed for basic test runs
trivy:
  enabled: false

dependencyTrack:
  enabled: false

edge:
  enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

cosign:
  enabled: false

autoscaling:
  enabled: false

pdb:
  enabled: false

scanWorkspace:
  enabled: false

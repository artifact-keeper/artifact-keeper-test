          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Platform tests (signing, SBOM, curation, labels, audit, backup)
  #
  # Serialized after auth-tests to avoid cross-suite admin-JWT
  # contamination. test-admin-password-recovery.sh changes the admin
  # password, which calls the backend's change_password handler
  # (backend/src/api/handlers/users.rs) and triggers
  # invalidate_user_tokens(admin_id). That writes the admin's UUID
  # into the global CREDENTIAL_INVALIDATIONS map in
  # backend/src/services/auth_service.rs, so any auth-tests step
  # running in parallel that uses the admin JWT starts getting 401s
  # mid-suite once its cached token validation flips to "rejected".
  # See #137. admin-tests is serialized for the same reason and on the
  # same job ordering (see the comment block above the admin-tests
  # job definition below).
  # -------------------------------------------------------------------
  platform-tests:
    needs: [deploy, auth-tests]
    if: inputs.test_suite == 'all' || inputs.test_suite == 'platform'
    runs-on: ak-e2e-runners
    env:
      BASE_URL: ${{ needs.deploy.outputs.backend_url }}
      RUN_ID: ${{ needs.deploy.outputs.run_id }}
      ADMIN_PASS: TestRunner!2026secure
      JUNIT_OUTPUT_DIR: /tmp/test-results
      # RELEASE_GATE=1 turns common.sh's skip_suite() into a hard fail.
      # A silently-skipped test in release-gate context is exactly the
      # silent-success class (#870/#871/#888) the gate exists to catch.
      RELEASE_GATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Run platform tests
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          chmod +x scripts/run-suite.sh
          ./scripts/run-suite.sh --suite platform --run-id "${RUN_ID}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-platform
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Auth tests (tokens, TOTP, rate limiting)
  # -------------------------------------------------------------------
  auth-tests:
    needs: deploy
    if: inputs.test_suite == 'all' || inputs.test_suite == 'auth'
    runs-on: ak-e2e-runners
    env:
      BASE_URL: ${{ needs.deploy.outputs.backend_url }}
      RUN_ID: ${{ needs.deploy.outputs.run_id }}
      ADMIN_PASS: TestRunner!2026secure
      JUNIT_OUTPUT_DIR: /tmp/test-results
      # RELEASE_GATE=1 turns common.sh's skip_suite() into a hard fail.
      # A silently-skipped test in release-gate context is exactly the
      # silent-success class (#870/#871/#888) the gate exists to catch.
      RELEASE_GATE: '1'
      # Mirror of RATE_LIMIT_ENABLED in helm/values-test.yaml and
      # helm/values-test-full.yaml, which the deploy job renders for the
      # backend Deployment. tests/auth/test-zz-rate-limiting.sh used to GUESS
      # this ("may not be enabled in test mode") and skip, so it could not tell
      # "deliberately disabled" from "enabled but broken" and certified nothing
      # (artifact-keeper-test#343).
      #
      # The suite verifies this declaration rather than trusting it: declared
      # off means it proves the limiter is inert before taking the documented
      # capability exemption, and declared on means a flood that never returns
      # 429 is a hard failure. KEEP THIS IN SYNC with the chart values -- if the
      # gate deploy re-enables the limiter, flip this to 'true' and drop the
      # rate_limit_disabled_in_gate row from _CAPABILITY_EXEMPTIONS.
      AK_RATE_LIMIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Install oathtool
        # tests/auth/test-totp-2fa.sh (and its totp-* siblings) need oathtool
        # to generate a real TOTP code, otherwise the "Enable TOTP" assertion
        # skips and the enrollment path is never exercised. oath-toolkit is in
        # the Ubuntu archive.
        run: |
          set -euo pipefail
          if ! command -v oathtool >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq oathtool > /dev/null
          fi
          oathtool --version | head -1

      - name: Run auth tests
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          chmod +x scripts/run-suite.sh
          ./scripts/run-suite.sh --suite auth --run-id "${RUN_ID}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-auth
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Admin tests (Epic 10, #77): operational admin endpoints
  #   livez, backup execute/cancel/delete, monitoring alerts,
  #   storage backends listing, reindex trigger.
  #
  # Serialized after auth-tests (same reason as platform-tests, see #137):
  # test-admin-password-recovery.sh in platform-tests changes the admin
  # password via change_password (backend/src/api/handlers/users.rs),
  # which writes the admin's UUID into the global CREDENTIAL_INVALIDATIONS
  # map (backend/src/services/auth_service.rs). Any suite using the admin
  # JWT that runs concurrently with auth-tests' password-change paths
  # starts getting 401s mid-suite once its cached token validation flips
  # to "rejected". admin-tests reuses ADMIN_PASS and exercises the admin
  # JWT on every endpoint it hits, so it has the same exposure as
  # platform-tests and gets the same serialization.
  # -------------------------------------------------------------------
  admin-tests:
    needs: [deploy, auth-tests]
    if: inputs.test_suite == 'all' || inputs.test_suite == 'admin'
    runs-on: ak-e2e-runners
    env:
      BASE_URL: ${{ needs.deploy.outputs.backend_url }}
      RUN_ID: ${{ needs.deploy.outputs.run_id }}
      NAMESPACE: ${{ needs.deploy.outputs.namespace }}
      ADMIN_PASS: TestRunner!2026secure
      JUNIT_OUTPUT_DIR: /tmp/test-results
      RELEASE_GATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Wait for OpenSearch ready
        # test-reindex.sh hits POST /api/v1/admin/reindex which requires
        # OpenSearch to be ready. Without this wait the endpoint can 404
        # (route not yet mounted on the backend's OpenSearch-dependent
        # path) or 503 and the test was previously soft-skipping on 404,
        # passing vacuously under RELEASE_GATE=1. Wait up to 120s for the
        # OpenSearch pod to be Ready before running the suite.
        run: |
          # Try the bitnami chart label first, then app=opensearch as a
          # fallback for charts that use the legacy label scheme. If the
          # selector matches no pods (e.g. opensearch.enabled=false in this
          # build) the wait is a no-op and the suite proceeds, which is
          # the right behavior for builds that don't ship OpenSearch.
          set -e
          if kubectl -n "$NAMESPACE" get pod -l app.kubernetes.io/name=opensearch -o name 2>/dev/null | grep -q pod/; then
            kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
              -l app.kubernetes.io/name=opensearch --timeout=120s
          elif kubectl -n "$NAMESPACE" get pod -l app=opensearch -o name 2>/dev/null | grep -q pod/; then
            kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
              -l app=opensearch --timeout=120s
          else
            echo "No OpenSearch pods found in ${NAMESPACE}; skipping wait."
          fi

      - name: Run admin tests
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          chmod +x scripts/run-suite.sh
          ./scripts/run-suite.sh --suite admin --run-id "${RUN_ID}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-admin
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Stress tests (after formats + security pass)
  #
  # continue-on-error: stress tests measure backend behavior under
  # sustained mixed-workload (auth + upload + download + list) on a
  # 2 CPU test pod inside the namespace's 4 CPU / 8 Gi quota. Error-
  # rate variance is high on ARC runners (observed 22-54% across
  # otherwise-identical runs) because the bcrypt-bound auth path
  # saturates first and the worker count drives RPS up faster than
  # the pod can absorb. The test still produces JUnit + run logs so
  # regressions are visible, but a single failed run does not block
  # the release gate. Real perf regressions are caught by dedicated
  # benchmark workflows on Rocky, not by this CI smoke gate.
  # See artifact-keeper#991 for v1.1.x auth-path perf investigation.
  # -------------------------------------------------------------------
  stress-tests:
    needs: [deploy, format-tests, repo-tests, promotion-tests, rbac-tests, lifecycle-tests, webhook-tests, search-tests, platform-tests, auth-tests, security-tests, compatibility-tests]
    continue-on-error: true
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      (inputs.test_suite == 'all' || inputs.test_suite == 'stress')
    runs-on: ak-e2e-runners
    env:
      BASE_URL: ${{ needs.deploy.outputs.backend_url }}
      RUN_ID: ${{ needs.deploy.outputs.run_id }}
      ADMIN_PASS: TestRunner!2026secure
      JUNIT_OUTPUT_DIR: /tmp/test-results
      # Per-request HTTP-code logs end up here. The Upload stress-test logs
      # step below ships this directory as a workflow artifact so a failed
      # stress run can be debugged endpoint-by-endpoint instead of from
      # aggregate error counts alone (artifact-keeper-test#138 /
      # artifact-keeper#1088).
      STRESS_LOG_DIR: /tmp/stress-logs
      # Postgres + pod-resource snapshot directory. The Collect postgres
      # stats step below runs tests/stress/collect-pg-stats.sh after the
      # stress run and ships this directory as the stress-pg-stats
      # artifact. Captures the direct measurement that PR #148's
      # Fresh-Eyes review (artifact-keeper-test#154) asked for: pg
      # connection saturation + kubectl top, so the postgres-CPU
      # narrative behind PR #140 is backed by evidence on every run.
      PG_STATS_DIR: /tmp/pg-stats
      NAMESPACE: ${{ needs.deploy.outputs.namespace }}
      # RELEASE_GATE=1 turns common.sh's skip_suite() into a hard fail.
      # A silently-skipped test in release-gate context is exactly the
      # silent-success class (#870/#871/#888) the gate exists to catch.
      RELEASE_GATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Run stress tests
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          mkdir -p "$STRESS_LOG_DIR"
          chmod +x scripts/run-suite.sh
          ./scripts/run-suite.sh --suite stress --run-id "${RUN_ID}"

      - name: Summarize per-request status codes
        if: always()
        run: |
          if [ ! -d "$STRESS_LOG_DIR" ] || [ -z "$(ls -A "$STRESS_LOG_DIR" 2>/dev/null)" ]; then
            echo "No stress logs were emitted at ${STRESS_LOG_DIR}"
            exit 0
          fi
          echo "## Stress-test per-request status codes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Per-request rows logged to artifact \`stress-request-logs\` at \`${STRESS_LOG_DIR}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Row format: \`<epoch_ms> <suite> <method> <endpoint> <http_code> <elapsed_ms>\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | Total | 2xx | 3xx | 4xx | 5xx | Timeouts (000) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------:|----:|----:|----:|----:|---------------:|" >> "$GITHUB_STEP_SUMMARY"
          for log in "$STRESS_LOG_DIR"/*.log; do
            [ -f "$log" ] || continue
            suite=$(basename "$log" .log)
            total=$(wc -l < "$log" | tr -d ' ')
            s2=$(awk '$5 ~ /^2[0-9][0-9]$/ {c++} END {print c+0}' "$log")
            s3=$(awk '$5 ~ /^3[0-9][0-9]$/ {c++} END {print c+0}' "$log")
            s4=$(awk '$5 ~ /^4[0-9][0-9]$/ {c++} END {print c+0}' "$log")
            s5=$(awk '$5 ~ /^5[0-9][0-9]$/ {c++} END {print c+0}' "$log")
            s0=$(awk '$5 == "000" {c++} END {print c+0}' "$log")
            echo "| ${suite} | ${total} | ${s2} | ${s3} | ${s4} | ${s5} | ${s0} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Echo a short per-suite breakdown to the runner log too, so an
          # operator can scan the job page without first downloading the
          # artifact. Cap at the top 10 non-2xx endpoints to keep the log
          # readable.
          echo "Top non-2xx endpoints per suite:"
          for log in "$STRESS_LOG_DIR"/*.log; do
            [ -f "$log" ] || continue
            suite=$(basename "$log" .log)
            echo "  ${suite}:"
            awk '$5 !~ /^2[0-9][0-9]$/ {print $5, $3, $4}' "$log" \
              | sort | uniq -c | sort -rn | head -n 10 \
              | sed 's/^/    /'
          done

      - name: Collect postgres stats
        # Snapshot pg_stat_activity, pg_stat_statements, connection-count
        # vs max_connections, and kubectl top for the backend + postgres
        # pods. Runs after the stress workload and before teardown so the
        # capture reflects steady-state load. if: always() ensures the
        # snapshot still ships on a failed run, which is exactly when
        # the data is most useful (artifact-keeper-test#154; rationale
        # in PR #148 Fresh-Eyes review, Finding 2).
        if: always()
        run: |
          bash tests/stress/collect-pg-stats.sh

      - name: Upload pg-stats snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-pg-stats-${{ github.run_attempt }}
          path: /tmp/pg-stats/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-stress
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

      - name: Upload stress-test logs
        # Per-request HTTP-code rows from the stress-test workers. Captured
        # before namespace teardown so a 50%-error run can be debugged
        # endpoint-by-endpoint (which path returned what code, how often)
        # instead of from aggregate counters alone. Investigating
        # artifact-keeper#1088 (POST /repositories DB contention under
        # load) would have been faster with this artifact in hand.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-request-logs
          path: /tmp/stress-logs/
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Resilience tests (after stress completes)
  #
  # Run regardless of stress-tests outcome. Resilience tests target
  # crash recovery, network partition, storage failures, etc., which
  # are independent of the bcrypt/auth saturation that stress-tests
  # measures. Skipping resilience because stress hit its error-rate
  # threshold loses signal on a different failure class.
  #
  # PARTIALLY SOFT — NAMED WAIVER, restart + storage legs only
  # (artifact-keeper-test#338).
  #
  # History: bafcb7a ("ci: make resilience tests non-blocking on ARC
  # runners", 2026-03-23) put `continue-on-error: true` on this job's only
  # test step but left the `needs.resilience-tests.result == 'failure' ||
  # ... == 'cancelled'` clause in the collect-results predicate. A
  # STEP-level continue-on-error swallows the step's `exit 1` and the job
  # conclusion stays `success`, so `needs.resilience-tests.result` was
  # never 'failure' and the predicate entry was inert. Every category
  # reported green unconditionally across v1.7.0 and v1.7.1. (The comment
  # block above the predicate is right that JOB-level continue-on-error
  # does not change `needs.<job>.result` — that is a different case, and
  # is exactly why the step-level one slipped through.)
  #
  # Evidence, 8 gate runs that reached this stage (#338 has the table):
  #   crash / data / network — 0 failures in 6/6 healthy runs. They degrade
  #     gracefully: unavailable kubectl operations call skip(), not fail().
  #   restart — the SAME 3 of 5 scripts fail in EVERY run (test-full-reboot,
  #     test-meilisearch-restart, test-pod-reschedule).
  #   storage — test-pvc-remount fails in EVERY run.
  #   (2 of the 8 runs failed everything at "backend not ready after 30s"
  #    before doing any work; those runs already failed several genuinely
  #    blocking suites, so they are not a resilience signal.)
  #
  # So crash/data/network are now GENUINELY BLOCKING — see the
  # matrix-conditional continue-on-error on the test step below.
  #
  # KNOWN GAP, stated plainly: restart + storage stay soft, and the reasons
  # are infra debt plus a real harness bug, not product regressions.
  #   1. The ARC runner ServiceAccount cannot patch deployments/scale in the
  #      ephemeral namespace, so test-full-reboot.sh cannot scale the backend
  #      ("Error from server (Forbidden): ... cannot patch resource
  #      deployments/scale").
  #   2. The resilience harness selects backend pods with
  #      `-l app=artifact-keeper-backend` while this workflow waits on them
  #      with `-l app.kubernetes.io/component=backend` (see lines ~594 and
  #      ~1331). The selector matches nothing, so test-pvc-remount and
  #      test-pod-reschedule fail with "no backend pod found".
  #   3. Meilisearch does not recover inside test-meilisearch-restart.sh's
  #      90s budget.
  # Selector fix (2) will likely surface MORE failures, including in the
  # now-blocking legs, because it also makes some currently-vacuous PASSes
  # real. That is intended. Nothing here is fixed by this waiver — restart
  # and storage are simply no longer pretending to be a gate.
  #   owner:   release-engineering (@brandon.geraci)
  #   expires: 2026-10-01 — on/after this date either land the RBAC grant +
  #            selector fix and drop continue-on-error from the step
  #            entirely, or re-justify this waiver in a PR.
  # -------------------------------------------------------------------
  resilience-tests:
    needs: [deploy, stress-tests]
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      (inputs.test_suite == 'all' || inputs.test_suite == 'resilience')
    runs-on: ak-e2e-runners
    strategy:
      fail-fast: false
      matrix:
        category: [crash, restart, network, storage, data]
    env:
      BASE_URL: ${{ needs.deploy.outputs.backend_url }}
      RUN_ID: ${{ needs.deploy.outputs.run_id }}
      ADMIN_PASS: TestRunner!2026secure
      NAMESPACE: ${{ needs.deploy.outputs.namespace }}
      JUNIT_OUTPUT_DIR: /tmp/test-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Run ${{ matrix.category }} resilience tests
        # Soft for the two waived legs ONLY (artifact-keeper-test#338).
        # crash, data and network evaluate to false here, so a failure in
        # those categories fails the step, fails the matrix leg, sets
        # needs.resilience-tests.result to 'failure', and blocks the gate
        # via the clause in collect-results. Do not widen this back to a
        # bare `true` — that is the bug this replaces.
        continue-on-error: ${{ matrix.category == 'restart' || matrix.category == 'storage' }}
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          FAILED=0
          for script in tests/resilience/${{ matrix.category }}/test-*.sh; do
            [ -f "$script" ] || continue
            echo "=== Running ${script} ==="
            if ! bash "$script"; then
              echo "FAILED: ${script}"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            case "${{ matrix.category }}" in
              restart|storage)
                echo "::warning::${FAILED} resilience test(s) failed in ${{ matrix.category }} (non-blocking: named waiver, artifact-keeper-test#338)"
                ;;
              *)
                echo "::error::${FAILED} resilience test(s) failed in ${{ matrix.category }} (BLOCKING - this fails the release gate)"
                ;;
            esac
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-resilience-${{ matrix.category }}
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Mesh tests (after resilience passes)
  # -------------------------------------------------------------------
  mesh-tests:
    needs: [deploy, resilience-tests]
    # SOFT — NAMED WAIVER (artifact-keeper-test#327).
    #
    # continue-on-error: multi-DC federation/replication (peer registration,
    # cross-instance sync, failover) cannot be fully exercised in the ephemeral
    # CI env — the sync worker isn't running and peer instances aren't reachable
    # there (the suite's own steps SKIP/FAIL with "sync worker not running in
    # ephemeral env"). Same known-infra-debt class as stress-tests; release.yml
    # already treats mesh as an optional gate. Kept in the run for visibility.
    # See artifact-keeper#1936.
    #
    # This comment used to claim the job was "excluded from the blocking
    # rollup" while collect-results still gated on
    # `needs.mesh-tests.result == 'failure'/'cancelled'`. continue-on-error
    # changes a job's CONCLUSION, not `needs.<job>.result`, so a mesh failure
    # DID block the release gate — a documented-advisory job that was in fact
    # a hard gate. Those two clauses are now removed from the predicate, so
    # intent and predicate finally agree.
    #
    # KNOWN GAP, stated plainly: mesh coverage is advisory, and the suite has
    # a real harness bug of its own — test-peer-failover.sh registers its
    # simulated "broken peer" at loopback `http://127.0.0.1:1`, which the
    # backend's peer-registration SSRF allowlist correctly 400s, so the
    # failover path is never exercised. That fix, and the migration of mesh
    # coverage onto a DTF tier (the shape oci-push-scope uses: digest-pinned,
    # INFRA-vs-regression labeled), are DEFERRED to a future release by
    # product direction. Nothing here is fixed — mesh is simply no longer
    # pretending to be a gate.
    #   owner:   release-engineering
    #   expires: 2026-12-01 — on/after this date either land the DTF
    #            peer-failover tier and make it blocking, or re-justify this
    #            waiver in a PR.
    continue-on-error: true
    if: |
      always() &&
      (inputs.test_suite == 'all' || inputs.test_suite == 'mesh') &&
      (needs.resilience-tests.result == 'success' || needs.resilience-tests.result == 'skipped')
    runs-on: ak-e2e-runners
    env:
      RUN_ID: ${{ needs.deploy.outputs.run_id }}
      ADMIN_PASS: TestRunner!2026secure
      JUNIT_OUTPUT_DIR: /tmp/test-results
      # RELEASE_GATE=1 turns common.sh's skip_suite() into a hard fail.
      # A silently-skipped test in release-gate context is exactly the
      # silent-success class (#870/#871/#888) the gate exists to catch.
      RELEASE_GATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Deploy mesh topology
        id: mesh-deploy
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          WEB_TAG: ${{ inputs.web_tag }}
        run: |
          MESH_RUN_ID="${RUN_ID}"
          chmod +x scripts/create-test-namespace.sh
          # Compose the digest-pinned image ref. Empty BACKEND_DIGEST =>
          # plain tag (byte-identical to the pre-digest behaviour).
          BACKEND_TAG_PINNED="${BACKEND_TAG}${BACKEND_DIGEST:+@${BACKEND_DIGEST}}"

          # Deploy 4 mesh instances
          for i in main peer1 peer2 peer3; do
            MESH_NS="test-${MESH_RUN_ID}-mesh-${i}"
            ./scripts/create-test-namespace.sh \
              --run-id "${MESH_RUN_ID}-mesh-${i}" \
              --backend-tag "${BACKEND_TAG_PINNED}" \
              --web-tag "${WEB_TAG}" \
              --values helm/values-test-mesh.yaml
          done

          # Output URLs
          BASE_NS="test-${MESH_RUN_ID}-mesh"
          echo "MAIN_URL=http://artifact-keeper-backend.${BASE_NS}-main.svc.cluster.local:8080" >> "$GITHUB_OUTPUT"
          echo "PEER1_URL=http://artifact-keeper-backend.${BASE_NS}-peer1.svc.cluster.local:8080" >> "$GITHUB_OUTPUT"
          echo "PEER2_URL=http://artifact-keeper-backend.${BASE_NS}-peer2.svc.cluster.local:8080" >> "$GITHUB_OUTPUT"
          echo "PEER3_URL=http://artifact-keeper-backend.${BASE_NS}-peer3.svc.cluster.local:8080" >> "$GITHUB_OUTPUT"

      - name: Wait for mesh instances ready
        run: |
          chmod +x tests/lib/wait-for-ready.sh
          for url in "${{ steps.mesh-deploy.outputs.MAIN_URL }}" \
                     "${{ steps.mesh-deploy.outputs.PEER1_URL }}" \
                     "${{ steps.mesh-deploy.outputs.PEER2_URL }}" \
                     "${{ steps.mesh-deploy.outputs.PEER3_URL }}"; do
            ./tests/lib/wait-for-ready.sh "$url" 300
          done

      - name: Run mesh tests
        env:
          MAIN_URL: ${{ steps.mesh-deploy.outputs.MAIN_URL }}
          PEER1_URL: ${{ steps.mesh-deploy.outputs.PEER1_URL }}
          PEER2_URL: ${{ steps.mesh-deploy.outputs.PEER2_URL }}
          PEER3_URL: ${{ steps.mesh-deploy.outputs.PEER3_URL }}
          BASE_URL: ${{ steps.mesh-deploy.outputs.MAIN_URL }}
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          chmod +x scripts/run-suite.sh
          ./scripts/run-suite.sh --suite mesh --run-id "${RUN_ID}"

      - name: Teardown mesh namespaces
        if: always() && inputs.skip_teardown != true
        run: |
          chmod +x scripts/teardown-test-namespace.sh
          for i in main peer1 peer2 peer3; do
            ./scripts/teardown-test-namespace.sh --run-id "${RUN_ID}-mesh-${i}" || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-mesh
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # DTF probe provisioning (artifact-keeper-test#323) — build the tier
  # probes on a NETWORK-CAPABLE runner so the required tiers never do.
  #
  # The `sso` tier signs its SAML assertions with a small Rust payload
  # generator (deploy-test/harness/tiers/sso/probe) that uses the SAME
  # crate the backend verifies with, so the signatures are byte-
  # compatible. It used to be compiled by the oracle itself at gate
  # time, which (a) violated this workflow's "required tiers make no
  # external network calls" invariant — the build pulls ~195 crates from
  # crates.io — and (b) simply fails on the ak-docker-runners dind pool,
  # which has no Rust toolchain and no registry egress. On the
  # 1.7.0-rc.2 gate that failed build was reported as a SAML security
  # regression on a candidate whose XSW protection was verified intact.
  #
  # So the probe is built HERE, once, on a network-capable runner and
  # handed to the tier as an artifact. The tier's build_probe() finds an
  # executable binary and no-ops; under RELEASE_GATE=1 it refuses to
  # cargo-build at all, so the invariant is enforced, not just intended.
  # The probe SOURCE remains the signer of record — only the moment of
  # compilation moved.
  #
  # Linking: a fully static musl build is NOT viable — the signer's dep
  # chain (bergshamra -> uppsala -> kryptering -> cryptoki -> cryptoki-sys)
  # uses dlopen/libdl for its (unused) PKCS#11 path, which forces dynamic
  # linking even on the musl target (artifact-keeper-test#325). Excising
  # that path risks the probe's signature byte-compatibility with the
  # backend verifier, so we keep the exact dep/feature set and build an
  # ordinary glibc binary on the OLDEST supported glibc (ubuntu-22.04) for
  # forward-compatibility with the dind pool — then VALIDATE BY EXECUTION
  # (a local smoke-exec here, plus the arch-check and keygen smoke-exec at
  # stage time on the actual dind runner) rather than by a static-link
  # string check.
  #
  # Target arch: x86_64 only, matching the ak-docker-runners pool. The
  # staging step below asserts the runner really is x86_64 and fails
  # loudly if not. If the pool ever gains arm64 runners, add an
  # aarch64 build leg here and select by `uname -m` when staging.
  # -------------------------------------------------------------------
  build-dtf-probes:
    if: inputs.test_suite == 'all' || inputs.test_suite == 'security' || inputs.test_suite == 'dtf'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Build the SAML XSW payload generator
        working-directory: deploy-test/harness/tiers/sso/probe
        run: |
          set -euo pipefail
          # --locked: build the exact dependency versions committed in the
          # probe's Cargo.lock, so the signer the gate uses is reproducible.
          # Native glibc target (a static musl build is blocked by
          # cryptoki-sys/dlopen; see the header note and #325).
          cargo build --release --locked
          BIN=target/release/dtf-saml-xsw-probe
          mkdir -p "${GITHUB_WORKSPACE}/dtf-probes"
          cp "$BIN" "${GITHUB_WORKSPACE}/dtf-probes/dtf-saml-xsw-probe"
          chmod +x "${GITHUB_WORKSPACE}/dtf-probes/dtf-saml-xsw-probe"
          file "${GITHUB_WORKSPACE}/dtf-probes/dtf-saml-xsw-probe"
          ldd  "${GITHUB_WORKSPACE}/dtf-probes/dtf-saml-xsw-probe" || true
          # Validate by EXECUTION, not by a static-link string: prove the
          # binary actually runs (mints an ephemeral IdP keypair) on this
          # build host. The dind staging step repeats this smoke-exec on the
          # real runner, so a glibc mismatch fails loudly and attributably
          # there rather than as a confusing SAML "regression" in the oracle.
          "${GITHUB_WORKSPACE}/dtf-probes/dtf-saml-xsw-probe" keygen "$(mktemp -d)" >/dev/null
          echo ">> probe built and smoke-exec OK on the build host"

      - name: Upload the DTF probe binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dtf-probes
          path: dtf-probes/
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # Deployment Test Framework gate (artifact-keeper#2697) — REQUIRED.
  #
  # Runs the DTF compose tiers (deploy-test/harness) against the EXACT
  # candidate image the release pipeline resolved: backend_tag pinned by
  # backend_digest (resolve-candidate-digest in artifact-keeper
  # release.yml). Docker pulls `name:tag@sha256:...` content-addressed,
  # and run-tiers.sh logs a digest-parity assertion after the pull, so
  # the tiers provably exercise the bytes that will ship — never
  # `:latest`, never a rebuild.
  #
  # BLOCKING: every leg of this matrix is a hard release gate, wired
  # into collect-results with the stricter `!= 'success'` predicate
  # (guarded by the suite-selection condition, same shape as the #2700
  # blocking security suite). The REQUIRED tier set is:
  #   core            — smoke (real push->pull->scan on a clean deploy)
  #                     + isolation (cross-tenant on a real shared S3
  #                     store; the #2504/#2574/#2584 class)
  #   upgrade-origins — upgrade-v156-origin + upgrade-v158-origin
  #                     (#2688 migration-ledger divergence; origins are
  #                     the published immutable 1.5.6/1.5.8 ghcr tags)
  #   security-authz  — the 1.6.1 advisory-class regression tiers
  #                     (vvc3 scoped-admin keystone, qcmj webhook authz,
  #                     f7qf peer authz, 5f2q upload scope, qxxr refresh
  #                     race) plus oci-push-scope, which carries the OCI
  #                     half of the token-exchange coverage migrated out
  #                     of the legacy security-tests suite
  #                     (artifact-keeper-test#327): a least-privilege
  #                     ["read:artifacts","write:artifacts"] token must
  #                     complete a real docker push, and a read-only one
  #                     must still be refused (artifact-keeper#3053).
  #   security-boundary — dos (rate-limit / worker-starvation), sso
  #                     (SAML XSW class), proxy-egress (SSRF egress
  #                     control)
  # Required tiers depend only on the candidate image plus local
  # containers (postgres/minio/keycloak/squid) — no external network
  # calls that could flake the gate. Tiers with heavier external
  # dependencies run soft in dtf-advisory below. Anything a required
  # tier needs from the network is PROVISIONED by build-dtf-probes
  # above and handed in as an artifact (artifact-keeper-test#323); the
  # sso tier, the one former violator, now refuses to build its probe
  # when RELEASE_GATE=1.
  #
  # The legacy-data `upgrade` tier is deliberately NOT wired: its
  # UPGRADE_OLD_IMAGE (ak-backend:nexus2457-v157base) is a rig-local
  # image with no published equivalent. The #2688 origin tiers cover the
  # upgrade class with published origins.
  #
  # Runs on the dind pool (ak-docker-runners): the DTF harness is
  # docker-compose based and the ak-e2e-runners k8s pods have no docker
  # daemon. Needs only version-set-integrity (image-existence check),
  # not the k8s deploy job — the DTF stands up its own stacks.
  #
  # Registry access: GHCR_DOCKER_CONFIG (the normal secret path, same as
  # clean-install-smoke) with a GITHUB_TOKEN docker-login fallback for
  # public images, via the shared deploy-test/harness/ghcr-docker-auth.sh
  # helper. The same secret expression resolves on BOTH the
  # workflow_call and workflow_dispatch paths (artifact-keeper#2701);
  # see the invocation-paths comment at the top of this file.
  # -------------------------------------------------------------------
  dtf-gate:
    needs: [version-set-integrity, build-dtf-probes]
    if: inputs.test_suite == 'all' || inputs.test_suite == 'security' || inputs.test_suite == 'dtf'
    runs-on: ak-docker-runners
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            tiers: smoke isolation
          - group: upgrade-origins
            tiers: upgrade-v156-origin upgrade-v158-origin
          - group: security-authz
            tiers: vvc3-scoped-admin qcmj-webhook-authz f7qf-peer-authz 5f2q-upload-scope qxxr-refresh-race oci-push-scope
          - group: security-boundary
            tiers: dos sso proxy-egress
    env:
      BACKEND_TAG: ${{ inputs.backend_tag }}
      BACKEND_DIGEST: ${{ inputs.backend_digest }}
      TIERS_LIST: ${{ matrix.tiers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Authenticate docker to ghcr
        env:
          GHCR_DOCKER_CONFIG: ${{ secrets.GHCR_DOCKER_CONFIG }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer the org pull-secret (private tags); fall back to the
          # workflow token (public images). Identical on the real
          # (workflow_call, secrets: inherit) and rehearsal
          # (workflow_dispatch, repo/org secret) paths -- #2701.
          chmod +x deploy-test/harness/ghcr-docker-auth.sh
          ./deploy-test/harness/ghcr-docker-auth.sh

      # Hand the sso tier its prebuilt signer. Only the group that runs the
      # tier needs it, so the other legs skip the download entirely.
      - name: Download the prebuilt DTF probes
        if: contains(matrix.tiers, 'sso')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dtf-probes
          path: /tmp/dtf-probes

      - name: Stage the SAML XSW probe for the sso tier
        if: contains(matrix.tiers, 'sso')
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          if [ "$ARCH" != "x86_64" ]; then
            echo "::error::runner arch is ${ARCH} but build-dtf-probes only builds x86_64;" \
                 "add the matching musl target to that job before running the sso tier here"
            exit 1
          fi
          DEST=deploy-test/harness/tiers/sso/probe/target/release
          mkdir -p "$DEST"
          install -m 0755 /tmp/dtf-probes/dtf-saml-xsw-probe "${DEST}/dtf-saml-xsw-probe"
          # Diagnostic only, and NOT a precondition: the ak-docker-runners dind
          # image ships no `file` binary, so under `set -e` this exited 127 and
          # skipped the whole sso tier on the 1.7.0-rc.3 gate — reported as an
          # sso gap on a candidate whose SAML XSW protection was never exercised.
          # The keygen smoke-exec below is the real check; keep this soft.
          file "${DEST}/dtf-saml-xsw-probe" || true
          # Prove it actually execs on THIS host before the tier depends on it,
          # so a bad binary is an obvious provisioning error here rather than a
          # confusing SAML failure inside the oracle.
          "${DEST}/dtf-saml-xsw-probe" keygen "$(mktemp -d)" >/dev/null
          echo ">> SAML XSW probe staged and smoke-checked at ${DEST}/dtf-saml-xsw-probe"

      - name: Run DTF tiers (${{ matrix.group }}) against the pinned candidate
        run: |
          # Compose the digest-pinned image ref. Empty BACKEND_DIGEST =>
          # plain tag (same composition as the k8s deploy jobs above).
          BACKEND_TAG_PINNED="${BACKEND_TAG}${BACKEND_DIGEST:+@${BACKEND_DIGEST}}"
          IMG="ghcr.io/artifact-keeper/artifact-keeper-backend:${BACKEND_TAG_PINNED}"
          chmod +x deploy-test/harness/run-tiers.sh deploy-test/harness/run.sh
          read -r -a TIERS <<< "${TIERS_LIST}"
          ./deploy-test/harness/run-tiers.sh --backend-image "${IMG}" "${TIERS[@]}"

      - name: Upload DTF tier results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-dtf-${{ matrix.group }}
          path: deploy-test/results/
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # DTF advisory legs (artifact-keeper#2697) — SOFT, named waivers.
  #
  # Same harness, same pinned candidate digest, but continue-on-error
  # and kept OFF the collect-results blocking predicate (the #2700
  # waiver shape: owner + expiry, no silent drift).
  #
  # NAMED WAIVERS
  #   supply-chain:
  #     reason:  the scanner-adapter's in-process Trivy pulls its vuln
  #              DB from ghcr at first scan; anonymous-token throttling
  #              under runner-pool load is a documented flake
  #              (artifact-keeper-test#306). The #2088 false-clean CLASS
  #              is still hard-gated in this same workflow by the
  #              blocking pinned-cve-image-gate, so this waiver creates
  #              no scanner-efficacy blind spot. The leg wires an
  #              authenticated DB pull (TRIVY_USERNAME/TRIVY_PASSWORD)
  #              plus the org DB mirror; once it holds green across a
  #              few releases, promote it into the required matrix.
  #   heavy-topology (migration, native-client, format-conformance):
  #     reason:  external upstreams (Nexus JVM boot, fedora/apt/docker
  #              client image pulls) dominate runtime and flake-rate on
  #              the shared dind pool; these have never run under ARC
  #              load (deploy-test/ARCHITECTURE.md section 7).
  #   owner:   release-engineering
  #   expires: 2026-10-01 — on/after this date either promote the leg
  #            into dtf-gate or re-justify the waiver in a PR.
  # -------------------------------------------------------------------
  dtf-advisory:
    needs: version-set-integrity
    continue-on-error: true
    if: inputs.test_suite == 'all' || inputs.test_suite == 'security' || inputs.test_suite == 'dtf'
    runs-on: ak-docker-runners
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: supply-chain
            tiers: supply-chain
          - group: heavy-topology
            tiers: migration native-client format-conformance
    env:
      BACKEND_TAG: ${{ inputs.backend_tag }}
      BACKEND_DIGEST: ${{ inputs.backend_digest }}
      TIERS_LIST: ${{ matrix.tiers }}
      # Published adapter image (major tag) + the org trivy-db mirror the
      # k8s gate already uses (#301), instead of the local-build defaults.
      SCANNER_ADAPTER_IMAGE: ghcr.io/artifact-keeper/artifact-keeper-scanner-adapter:1
      TRIVY_DB_REPOSITORY: ghcr.io/artifact-keeper/trivy-db
      # Authenticated DB pull so the adapter's trivy is not at the mercy
      # of ghcr anonymous-token throttling (see waiver above). The DTF
      # stack scans within minutes of job start, so the job-scoped token
      # cannot expire mid-gate (the #305 k8s failure mode does not apply).
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Authenticate docker to ghcr
        env:
          GHCR_DOCKER_CONFIG: ${{ secrets.GHCR_DOCKER_CONFIG }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same shared auth path as dtf-gate above (#2701).
          chmod +x deploy-test/harness/ghcr-docker-auth.sh
          ./deploy-test/harness/ghcr-docker-auth.sh

      - name: Run DTF advisory tiers (${{ matrix.group }}) against the pinned candidate
        run: |
          BACKEND_TAG_PINNED="${BACKEND_TAG}${BACKEND_DIGEST:+@${BACKEND_DIGEST}}"
          IMG="ghcr.io/artifact-keeper/artifact-keeper-backend:${BACKEND_TAG_PINNED}"
          chmod +x deploy-test/harness/run-tiers.sh deploy-test/harness/run.sh
          read -r -a TIERS <<< "${TIERS_LIST}"
          ./deploy-test/harness/run-tiers.sh --backend-image "${IMG}" "${TIERS[@]}"

      - name: Upload DTF advisory tier results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-dtf-advisory-${{ matrix.group }}
          path: deploy-test/results/
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Collect results and publish summary
  # -------------------------------------------------------------------
  collect-results:
    needs: [version-set-integrity, clean-install-smoke, clean-install-smoke-with-deps, chart-upgrade-smoke, deploy, real-flow-smoke, scan-completion-gate, sbom-correctness-gate, pinned-cve-gate, pinned-cve-image-gate, format-tests, security-tests, security-grype-scan-completes, compatibility-tests, repo-tests, promotion-tests, rbac-tests, lifecycle-tests, webhook-tests, search-tests, platform-tests, auth-tests, admin-tests, stress-tests, resilience-tests, mesh-tests, dtf-gate, dtf-advisory]
    if: always()
    # Result rollup only: aggregates needs[].result and downloads JUnit
    # artifacts. No cluster access. Runs on a hosted runner so a
    # cancelled or timed-out run terminates the rollup cleanly instead
    # of leaving it queued behind a saturated or offline ARC pool.
    runs-on: ubuntu-latest
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: junit-*
          path: /tmp/all-results
          merge-multiple: true

      - name: Publish test summary
        if: always()
        run: |
          echo "## Release Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for job in version-set-integrity clean-install-smoke clean-install-smoke-with-deps chart-upgrade-smoke real-flow-smoke scan-completion-gate sbom-correctness-gate pinned-cve-gate pinned-cve-image-gate format-tests repo-tests promotion-tests rbac-tests lifecycle-tests webhook-tests search-tests platform-tests auth-tests admin-tests security-tests security-grype-scan-completes compatibility-tests stress-tests resilience-tests mesh-tests dtf-gate dtf-advisory; do
            status="skipped"
            case "$job" in
              version-set-integrity) status="${{ needs.version-set-integrity.result }}" ;;
              clean-install-smoke) status="${{ needs.clean-install-smoke.result }}" ;;
              clean-install-smoke-with-deps) status="${{ needs.clean-install-smoke-with-deps.result }}" ;;
              chart-upgrade-smoke) status="${{ needs.chart-upgrade-smoke.result }}" ;;
              real-flow-smoke) status="${{ needs.real-flow-smoke.result }}" ;;
              scan-completion-gate) status="${{ needs.scan-completion-gate.result }}" ;;
              sbom-correctness-gate) status="${{ needs.sbom-correctness-gate.result }}" ;;
              pinned-cve-gate) status="${{ needs.pinned-cve-gate.result }}" ;;
              pinned-cve-image-gate) status="${{ needs.pinned-cve-image-gate.result }}" ;;
              format-tests) status="${{ needs.format-tests.result }}" ;;
              repo-tests) status="${{ needs.repo-tests.result }}" ;;
              promotion-tests) status="${{ needs.promotion-tests.result }}" ;;
              rbac-tests) status="${{ needs.rbac-tests.result }}" ;;
              lifecycle-tests) status="${{ needs.lifecycle-tests.result }}" ;;
              webhook-tests) status="${{ needs.webhook-tests.result }}" ;;
              search-tests) status="${{ needs.search-tests.result }}" ;;
              platform-tests) status="${{ needs.platform-tests.result }}" ;;
              auth-tests) status="${{ needs.auth-tests.result }}" ;;
              admin-tests) status="${{ needs.admin-tests.result }}" ;;
              security-tests) status="${{ needs.security-tests.result }}" ;;
              security-grype-scan-completes) status="${{ needs.security-grype-scan-completes.result }}" ;;
              compatibility-tests) status="${{ needs.compatibility-tests.result }}" ;;
              stress-tests) status="${{ needs.stress-tests.result }}" ;;
              resilience-tests) status="${{ needs.resilience-tests.result }}" ;;
              mesh-tests) status="${{ needs.mesh-tests.result }}" ;;
              dtf-gate) status="${{ needs.dtf-gate.result }}" ;;
              dtf-advisory) status="${{ needs.dtf-advisory.result }}" ;;
            esac
            echo "| ${job} | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Backend tag:** \`${{ inputs.backend_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Web tag:** \`${{ inputs.web_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** \`${{ needs.deploy.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-results
          path: /tmp/all-results/
          if-no-files-found: ignore

      - name: Gate check - fail if any required suite did not succeed
        # dtf-gate (artifact-keeper#2697) is REQUIRED: it runs the DTF
        # compose tiers against the digest-pinned candidate and uses the
        # stricter `!= 'success'` predicate, guarded by the suite-selection
        # condition (all/security/dtf) so a partial non-DTF invocation,
        # where the job legitimately skips, still passes. dtf-advisory is
        # SOFT (continue-on-error, named waivers with owner + expiry in the
        # job comment) and stays OFF this predicate.
        #
        # security-tests is now BLOCKING (#2700). It is enforced with the
        # stricter `!= 'success'` predicate (like the silent-success gates) so a
        # 'skipped' outcome cannot mask a security regression -- guarded by the
        # suite-selection condition so a partial non-security invocation
        # (inputs.test_suite != 'all'/'security'), where the job legitimately
        # skips, still passes. The single known-flaky Grype scan was carved out
        # into the soft, WAIVERED security-grype-scan-completes job (owner +
        # expiry 2026-10-01, artifact-keeper#1001), which stays OFF this
        # predicate. Grype image-scan efficacy remains hard-gated by
        # pinned-cve-image-gate.
        #
        # stress-tests and mesh-tests are intentionally excluded
        # (continue-on-error: true, named waivers on the jobs themselves):
        #   - stress-tests: bcrypt-bound auth saturation under sustained
        #     load on shared ARC runners (artifact-keeper#991).
        #   - mesh-tests: its job header always documented it as advisory,
        #     but the two `needs.mesh-tests.result` clauses that used to sit
        #     at the end of this predicate made it blocking anyway
        #     (continue-on-error does not change `needs.<job>.result` — see
        #     the note above). Those clauses are removed
        #     (artifact-keeper-test#327) so the documented intent and the
        #     predicate agree. Migrating mesh coverage onto a DTF tier is
        #     DEFERRED to a future release; owner + expiry are on the job.
        #
        # The three new silent-success gates (scan-completion-gate,
        # sbom-correctness-gate, pinned-cve-gate) use the STRICTER
        # `result != 'success'` predicate. The looser
        # `result == 'failure' || result == 'cancelled'` form lets a
        # 'skipped' outcome (matrix-leg eval failure, future conditional
        # `if:` gate, or a transitive `needs:` skip when `deploy` is
        # skipped) through as green. For the silent-success gates that
        # is precisely the regression class we are guarding against, so
        # we close it explicitly.
        #
        # clean-install-smoke-with-deps is the one legitimate 'skipped'
        # case: it is opt-in (gated on the `run_smoke_with_deps` workflow
        # input, default false; see #53). When the input is false the
        # job's result is 'skipped' by design. We continue to use the
        # looser predicate for it so the default-off path stays green.
        # When the input is true, a failure or cancellation DOES block
        # the release.
        #
        # resilience-tests is a PARTIAL gate. Its clause below is real, but
        # it only bites for the crash, data and network matrix legs: the
        # job's test step carries a matrix-conditional continue-on-error
        # that stays true for restart and storage under a named waiver
        # (artifact-keeper-test#338; owner + expiry are on that job). Note
        # this is a STEP-level continue-on-error, which — unlike the
        # job-level case discussed above — DOES suppress the leg's failure
        # and therefore the job result. Until bafcb7a's bare
        # `continue-on-error: true` was narrowed, that suppression applied
        # to all five legs and made this clause dead.
        #
        # The wildcard form contains(needs.*.result, 'failure') still
        # observes failures because needs.<job>.result reflects the
        # job's outcome, not its continue-on-error-adjusted conclusion.
        # So we list the required suites explicitly here. If you add a
        # new required suite, add it to this list. Soft-failing suites
        # stay off the list.
        if: >-
          needs.version-set-integrity.result == 'failure' || needs.version-set-integrity.result == 'cancelled' ||
          needs.clean-install-smoke.result == 'failure' || needs.clean-install-smoke.result == 'cancelled' ||
          needs.clean-install-smoke-with-deps.result == 'failure' || needs.clean-install-smoke-with-deps.result == 'cancelled' ||
          needs.chart-upgrade-smoke.result == 'failure' || needs.chart-upgrade-smoke.result == 'cancelled' ||
          needs.real-flow-smoke.result == 'failure' || needs.real-flow-smoke.result == 'cancelled' ||
          needs.scan-completion-gate.result != 'success' ||
          needs.sbom-correctness-gate.result != 'success' ||
          needs.pinned-cve-gate.result != 'success' ||
          needs.pinned-cve-image-gate.result != 'success' ||
          ((needs.security-tests.result != 'success') && (inputs.test_suite == 'all' || inputs.test_suite == 'security')) ||
          ((needs.dtf-gate.result != 'success') && (inputs.test_suite == 'all' || inputs.test_suite == 'security' || inputs.test_suite == 'dtf')) ||
          needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled' ||
          needs.format-tests.result == 'failure' || needs.format-tests.result == 'cancelled' ||
          needs.compatibility-tests.result == 'failure' || needs.compatibility-tests.result == 'cancelled' ||
          needs.repo-tests.result == 'failure' || needs.repo-tests.result == 'cancelled' ||
          needs.promotion-tests.result == 'failure' || needs.promotion-tests.result == 'cancelled' ||
          needs.rbac-tests.result == 'failure' || needs.rbac-tests.result == 'cancelled' ||
          needs.lifecycle-tests.result == 'failure' || needs.lifecycle-tests.result == 'cancelled' ||
          needs.webhook-tests.result == 'failure' || needs.webhook-tests.result == 'cancelled' ||
          needs.search-tests.result == 'failure' || needs.search-tests.result == 'cancelled' ||
          needs.platform-tests.result == 'failure' || needs.platform-tests.result == 'cancelled' ||
          needs.auth-tests.result == 'failure' || needs.auth-tests.result == 'cancelled' ||
          needs.admin-tests.result == 'failure' || needs.admin-tests.result == 'cancelled' ||
          needs.resilience-tests.result == 'failure' || needs.resilience-tests.result == 'cancelled'
        run: |
          echo "::error::Release gate FAILED - one or more required test suites did not pass"
          echo "Review the workflow summary above for details"
          echo "Note: stress-tests and mesh-tests are non-blocking (named waivers on those jobs); their outcomes are shown in the summary but do not gate the release"
          echo "Note: resilience-tests is blocking for the crash, data and network categories only; its restart and storage categories are non-blocking under a named waiver on that job (artifact-keeper-test#338)"
          exit 1

  # -------------------------------------------------------------------
  # Teardown
  # -------------------------------------------------------------------
  teardown:
    needs: [deploy, collect-results]
    if: always() && inputs.skip_teardown != true
    runs-on: ak-e2e-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Teardown test namespace
        env:
          RUN_ID: ${{ needs.deploy.outputs.run_id }}
        run: |
          chmod +x scripts/teardown-test-namespace.sh
          ./scripts/teardown-test-namespace.sh --run-id "${RUN_ID}"

      - name: Upload pod logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pod-logs
          path: /tmp/test-logs/
          if-no-files-found: ignore

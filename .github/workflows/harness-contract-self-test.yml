name: Harness Contract Self-Test

# Meta-test that pins the RELEASE_GATE coverage contract in
# tests/lib/common.sh so a future change cannot silently turn it back into a
# no-op (artifact-keeper-test#339).
#
# Why this exists
# ---------------
# skip_suite already hard-fails under RELEASE_GATE=1 on the reasoning that "a
# silently skipped suite is indistinguishable from a passing one". The
# per-test skip path had no equivalent floor: a suite in which every test
# skipped exited 0 and certified nothing, and require_feature reached that
# state from a single failed GET /health. Release gate run 28989233755 shipped
# green with six suites in blocking jobs (four in security-tests, two in
# auth-tests) having asserted nothing at all.
#
# The floor is only worth as much as its resistance to erosion, and it is
# three small, individually-deletable pieces of shell. The self-test
# constructs each failure and asserts the exit code, so removing the retry,
# the infra_fail routing, or the end_suite coverage floor turns this red.
#
# It also pins the applicability split (artifact-keeper-test#396): a skip
# because the CANDIDATE'S VERSION is below the floor a test declares is a
# verdict (the feature is not in this release, nothing to certify) and exits 0,
# while a skip because the ENVIRONMENT could not run the test keeps failing.
# That split is carried by the primitive the caller chose, not by the wording of
# a reason string, and the cases pin it in both directions -- including a
# provisioning skip whose reason merely reads like a version gate.
#
# The self-test also pins the DISCOVERY contract: every test-*.sh under tests/
# must source tests/lib/common.sh. scripts/run-suite.sh globs recursively and
# judges a script on its exit status alone, so a script that brings its own
# framework inherits none of the semantics pinned above -- no JUnit XML, no
# RELEASE_GATE skip handling, and no exit code at all if its own fail() forgets
# to set one. tests/security/redteam/ was exactly that for five months inside
# the blocking security-tests job (tests/security/README-redteam-port.md).
# That case is a tree-wide grep, so this workflow triggers on any change under
# tests/ rather than only on the lib files.
#
# It also pins the VERDICT SHAPE of release-gate.yml (artifact-keeper-test#359):
# every job is either on collect-results' predicate or job-level
# continue-on-error, so no job can veto a release the verdict passed.
#
# Runs on a plain hosted runner: the fixtures are a closed TCP port and a
# small python /health stub, so no cluster and no deployed candidate needed.

on:
  pull_request:
    paths:
      # Tree-wide: the discovery contract is a grep over every test script, so
      # adding one anywhere has to re-run this job.
      - 'tests/**'
      - 'scripts/run-suite.sh'
      - 'scripts/validate-gate-inputs.sh'
      - 'scripts/selftest-validate-gate-inputs.sh'
      - 'scripts/switch-tests-ref.sh'
      - 'scripts/selftest-switch-tests-ref.sh'
      - 'scripts/gate-selection.sh'
      - 'scripts/gate-subset-verdict.sh'
      - 'scripts/selftest-gate-subset-verdict.sh'
      - 'scripts/selftest-release-gate-verdict.sh'
      - 'scripts/selftest-gate-concurrency.sh'
      - 'scripts/selftest-gate-needs-closure.sh'
      # The subset self-test reads the job ids, the dtf-gate groups and the
      # full-run predicate from the gate itself.
      - '.github/workflows/release-gate.yml'
      - 'scripts/ci/**'
      - 'deploy-test/harness/run-tiers.sh'
      - 'deploy-test/harness/lib/exit_codes.sh'
      - 'scripts/clean-install-smoke.sh'
      - 'scripts/tests/test-clean-install-smoke-exit-codes.sh'
      - 'scripts/create-test-namespace.sh'
      - 'deploy-test/harness/lib/internet_fetch.sh'
      - 'deploy-test/harness/lib/native_client.sh'
      - 'deploy-test/harness/tiers/format-conformance/oracle.sh'
      - '.github/workflows/harness-contract-self-test.yml'
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'scripts/run-suite.sh'
      - 'scripts/validate-gate-inputs.sh'
      - 'scripts/selftest-validate-gate-inputs.sh'
      - 'scripts/switch-tests-ref.sh'
      - 'scripts/selftest-switch-tests-ref.sh'
      - 'scripts/gate-selection.sh'
      - 'scripts/gate-subset-verdict.sh'
      - 'scripts/selftest-gate-subset-verdict.sh'
      - 'scripts/selftest-release-gate-verdict.sh'
      - 'scripts/selftest-gate-concurrency.sh'
      - 'scripts/selftest-gate-needs-closure.sh'
      # The subset self-test reads the job ids, the dtf-gate groups and the
      # full-run predicate from the gate itself.
      - '.github/workflows/release-gate.yml'
      - 'scripts/ci/**'
      - 'deploy-test/harness/run-tiers.sh'
      - 'deploy-test/harness/lib/exit_codes.sh'
      - 'scripts/clean-install-smoke.sh'
      - 'scripts/tests/test-clean-install-smoke-exit-codes.sh'
      - 'scripts/create-test-namespace.sh'
      - 'deploy-test/harness/lib/internet_fetch.sh'
      - 'deploy-test/harness/lib/native_client.sh'
      - 'deploy-test/harness/tiers/format-conformance/oracle.sh'
      - '.github/workflows/harness-contract-self-test.yml'
  workflow_dispatch:

concurrency:
  group: harness-contract-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate-contract:
    name: RELEASE_GATE coverage contract must hold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run release-gate contract self-test
        run: |
          chmod +x tests/lib/selftest-release-gate-contract.sh
          ./tests/lib/selftest-release-gate-contract.sh

      # The resilience suites' pod selection and readiness classification
      # (tests/lib/k8s.sh, artifact-keeper-test#354): a selector that matches
      # nothing is INFRA, never a pass or a skip.
      - name: Run k8s selector self-test
        run: bash tests/lib/selftest-k8s-selectors.sh

      # The resilience fault injector (tests/lib/k8s.sh, artifact-keeper-test#842):
      # a fault that cannot be set up is INFRA, the injector images stay
      # pinned by digest, and no fault suite can skip.
      - name: Run k8s fault-injector self-test
        run: bash tests/lib/selftest-k8s-fault-injector.sh

      # Work dirs default under DTF_WORK_PARENT / RUNNER_TEMP so a dind
      # daemon can see them as bind-mount sources (artifact-keeper-test#732).
      - name: Run work-dir parent self-test
        run: bash tests/lib/selftest-work-parent.sh

      # The release gate's input validator (scripts/validate-gate-inputs.sh):
      # the values callers pass are accepted, everything else is refused.
      - name: Run gate-input validator self-test
        run: bash scripts/selftest-validate-gate-inputs.sh

      # The tests-tree pin (GATE_TESTS_SHA, artifact-keeper-test#830): a pin
      # lands on exactly the commit asked for, or fails the job.
      - name: Run switch-tests-ref self-test
        run: bash scripts/selftest-switch-tests-ref.sh

      # Subset runs (only_jobs, artifact-keeper-test#830): what may be
      # selected, how a subset is judged, and that the subset verdict's
      # required lists match the full-run predicate.
      - name: Run gate subset-run self-test
        run: bash scripts/selftest-gate-subset-verdict.sh

      # Every release-gate job counts in collect-results' verdict or carries
      # job-level continue-on-error, so the workflow conclusion the callers
      # read cannot disagree with the verdict (artifact-keeper-test#359).
      - name: Run release-gate verdict-shape self-test
        run: bash scripts/selftest-release-gate-verdict.sh

      # release-gate.yml's concurrency classes (artifact-keeper-test#840): a
      # candidate's gate and its rerun share one group nothing else joins,
      # other full gates on a tag serialize, narrow dispatches never cancel
      # each other.
      - name: Run release-gate concurrency self-test
        run: bash scripts/selftest-gate-concurrency.sh

      # A job that can be selected (test_suite or only_jobs) never skips
      # because a prerequisite in its needs: was not selected with it
      # (artifact-keeper-test#870).
      - name: Run release-gate needs-closure self-test
        run: bash scripts/selftest-gate-needs-closure.sh

      # require_wait_budget (tests/lib/common.sh) and run-suite.sh's
      # TEST_TIMEOUT hand-off: a script whose own waits cannot fit inside the
      # per-script cap fails loudly instead of being killed with exit 124
      # (artifact-keeper-test#832).
      - name: Run wait-budget self-test
        run: bash tests/lib/selftest-wait-budget.sh

      # No unexplained fixed sleep in a blocking suite: a whole-second
      # `sleep N` is a bounded poll on the real precondition, or carries a
      # `# sleep-ok: <reason>` (artifact-keeper-test#364).
      - name: Run fixed-sleep lint
        run: bash tests/lib/selftest-sleep-lint.sh

      # fetch_all_pages (tests/lib/common.sh): suites that look for their own
      # fixture in a paginated listing read every page, not page 1
      # (artifact-keeper-test#725).
      - name: Run fetch-all-pages self-test
        run: bash tests/lib/selftest-fetch-all-pages.sh

      # artifact_listed / await_artifact_listed (tests/lib/common.sh): the
      # bounded wait that replaced `upload; sleep 1; assert the index` in the
      # format suites; a row that never lands is a named FAIL, never a pass
      # (artifact-keeper-test#364).
      - name: Run artifact-listed self-test
        run: bash tests/lib/selftest-artifact-listed.sh

      # The release gate's runner-toolchain installer (scripts/ci/apt-install-retry.sh):
      # a mirror blip retries, a persistent failure or a missing tool fails
      # loudly as INFRA, never silently (#728).
      - name: Run apt install retry helper self-test
        run: bash scripts/ci/selftest-apt-install-retry.sh

      # The dtf-advisory outcome mapper and run-tiers.sh's aggregate exit
      # code: INFRA is retried once and warned about, a product FAIL is red
      # (artifact-keeper-test#378).
      - name: Run dtf-advisory outcome self-test
        run: bash scripts/ci/selftest-dtf-advisory-outcome.sh

      # The nightly S3 format matrix reads the gate's format-tests batches and
      # install step at run time (artifact-keeper#6121): the reader still
      # understands release-gate.yml, and an unreadable gate is an error.
      - name: Run gate format-batches reader self-test
        run: bash scripts/ci/selftest-gate-format-batches.sh

      # clean-install-smoke's /readyz probe exit codes (artifact-keeper-test#835):
      # a probe pod that cannot start is INFRA (11), /readyz non-200 stays 3.
      - name: Run clean-install-smoke exit-code self-test
        run: bash scripts/tests/test-clean-install-smoke-exit-codes.sh

      # admin-tests' OpenSearch wait (scripts/ci/wait-component-ready.sh,
      # artifact-keeper-test#841): the chart's selector, no match is INFRA.
      - name: Run component wait self-test
        run: bash scripts/ci/selftest-wait-component-ready.sh

      # Every test-namespace helm install puts its PVCs on AK_TEST_STORAGE_CLASS
      # (tests/lib/storage-class.sh, artifact-keeper/artifact-keeper#6081), and
      # no install site may skip it.
      - name: Run test StorageClass self-test
        run: bash tests/lib/selftest-storage-class.sh

      # A test client that cannot download its own tooling from the internet
      # (Maven Central, PyPI, npmjs, GitHub, distro mirrors) is INFRA, not a
      # product FAIL, in format-conformance (artifact-keeper#6193).
      - name: Run DTF client-download INFRA self-test
        run: bash scripts/ci/selftest-dtf-client-fetch-infra.sh

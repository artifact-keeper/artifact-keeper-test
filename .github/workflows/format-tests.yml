name: Format Tests

on:
  workflow_call:
    inputs:
      backend_url:
        required: true
        type: string
      run_id:
        required: true
        type: string
      batch:
        required: false
        type: string
        default: 'all'

jobs:
  test:
    runs-on: ak-e2e-runners
    # Bound the per-batch runtime. Without this a single hung mvn / pip /
    # docker-pull burns a runner slot for the workflow's default 6h. The
    # heaviest batch (jvm with maven install + remote fetch) routinely
    # completes inside 8 min on a warm runner; 25m gives headroom for
    # cold-start + image pulls without leaking runners on a real hang.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        batch:
          - name: node
            scripts: "test-npm.sh test-vscode.sh"
          - name: python
            scripts: "test-pypi.sh test-pypi-native-client.sh test-pypi-scoped-token.sh test-conda.sh test-huggingface.sh test-mlmodel.sh"
          - name: jvm
            scripts: "test-maven.sh test-maven-native-client.sh test-maven-virtual-snapshot.sh test-sbt.sh test-gradle-conformance.sh"
          - name: rust-go-swift
            scripts: "test-cargo.sh test-go.sh test-swift.sh test-pub.sh"
          - name: system-packages
            scripts: "test-debian.sh test-rpm.sh test-alpine.sh test-opkg.sh"
          - name: containers
            scripts: "test-oci.sh test-docker-native-client.sh test-helm.sh test-incus.sh test-streaming-blob-fallback.sh"
          - name: misc-native
            scripts: "test-terraform.sh test-composer.sh test-composer-dist-cache.sh test-hex.sh test-rubygems.sh test-nuget.sh test-cocoapods.sh test-cran.sh"
          - name: generic-protocol
            scripts: "test-generic.sh test-generic-native-client.sh test-gitlfs.sh test-protobuf.sh test-bazel.sh test-conan.sh test-conan-auth.sh test-conan-recipes.sh test-conan-packages.sh test-conan-search.sh test-conan-revisions.sh test-conan-remote.sh test-conan-errors.sh test-conan-stress.sh test-ansible.sh test-p2.sh test-jetbrains.sh test-vagrant.sh test-wasm.sh test-puppet.sh test-chef.sh"
    env:
      BASE_URL: ${{ inputs.backend_url }}
      RUN_ID: ${{ inputs.run_id }}
      JUNIT_OUTPUT_DIR: /tmp/test-results
      # RELEASE_GATE=1 turns common.sh's skip_suite() into a hard fail.
      # A silently-skipped test in release-gate context is exactly the
      # silent-success class (#870/#871/#888) the gate exists to catch.
      # Local-dev runs don't set this and keep graceful skip behavior.
      RELEASE_GATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ${{ matrix.batch.name }} tests
        if: inputs.batch == 'all' || inputs.batch == matrix.batch.name
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          exit_code=0
          for script in ${{ matrix.batch.scripts }}; do
            echo "=== Running ${script} ==="
            if ! bash "tests/formats/${script}"; then
              echo "FAILED: ${script}"
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-formats-${{ matrix.batch.name }}
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Non-blocking audit lane (formats-autodiscovery issue).
  #
  # tests/formats was the only suite in this repo without run-suite.sh
  # glob discovery -- every script had to be hand-added to a batch's
  # `scripts:` field above, and 59 of 120 never were, including a
  # regression gate for artifact-keeper#2477 that has never executed.
  #
  # This job runs everything the `test` job's matrix does NOT name, via
  # real discovery (scripts/run-suite.sh --suite formats --exclude ...),
  # so a newly-added script always runs SOMEWHERE automatically instead of
  # silently nowhere. It is deliberately non-blocking: these scripts have
  # never been vetted in CI, some may need a toolchain this job does not
  # install, some may be stale. continue-on-error means a failure here
  # never fails this reusable workflow or a caller of it. The JUnit
  # artifact is the promotion signal: once a script is seen passing here
  # repeatedly, move its name into a `scripts:` field above and it
  # automatically drops out of this lane (see the exclude computation
  # below) and becomes blocking.
  # -------------------------------------------------------------------
  audit:
    runs-on: ak-e2e-runners
    if: inputs.batch == 'all' || inputs.batch == 'audit'
    continue-on-error: true
    # 58 not-yet-blocking scripts today, each capped at TEST_TIMEOUT (120s
    # default) run serially by run-suite.sh. 90m is headroom for that
    # worst case, not the expected runtime -- most scripts here either
    # pass or fail (missing tool, auth error) in well under their timeout.
    timeout-minutes: 90
    env:
      BASE_URL: ${{ inputs.backend_url }}
      RUN_ID: ${{ inputs.run_id }}
      JUNIT_OUTPUT_DIR: /tmp/test-results
      # Same as the `test` job: a script that silently skips itself should
      # show up as a failure in the audit report, not a quiet pass.
      RELEASE_GATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run formats audit lane
        run: |
          mkdir -p "$JUNIT_OUTPUT_DIR"
          chmod +x scripts/run-suite.sh
          # Exclude = this file's own blocking batches (the `scripts:`
          # fields above), re-read from the workflow file itself, plus
          # anything explicitly acknowledged in
          # tests/formats/audit-excluded.txt. Computed at run time from
          # the same source the matrix above is hand-written from, so this
          # lane cannot drift out of sync with what's blocking: a script
          # is always in exactly one of blocking, audited, or excluded.
          # scripts/check-formats-registration.sh independently re-derives
          # and verifies this same split.
          EXCLUDE_ARG=$(
            { grep 'scripts:' .github/workflows/format-tests.yml | grep -oE 'test-[a-zA-Z0-9.-]+\.sh';
              [ -f tests/formats/audit-excluded.txt ] && grep -vE '^\s*#|^\s*$' tests/formats/audit-excluded.txt; } \
            | sort -u | paste -sd, -
          )
          ./scripts/run-suite.sh --suite formats --exclude "$EXCLUDE_ARG" --run-id "${RUN_ID}"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-formats-audit
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Static registration check (formats-autodiscovery issue).
  #
  # Cluster-free and independent of the two jobs above: fails fast if a
  # batch above names a script that no longer exists (stale/typo'd
  # reference), or if a script is both blocking and listed in
  # audit-excluded.txt. See scripts/check-formats-registration.sh for what
  # it does and does not catch.
  # -------------------------------------------------------------------
  registration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formats registration
        run: |
          chmod +x scripts/check-formats-registration.sh
          ./scripts/check-formats-registration.sh .github/workflows/format-tests.yml
